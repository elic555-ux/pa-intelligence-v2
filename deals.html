<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>חדר עסקאות - PA Real Estate Intelligence Hub</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- HTML2PDF Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800;900&display=swap');
        body {
            font-family: 'Assistant', sans-serif;
            background-color: #0b0f19;
            color: #f9fafb;
        }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #111827; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #374151; border-radius: 3px; }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased">

    <!-- Header & Navigation -->
    <header class="bg-gray-900/90 border-b border-gray-800 sticky top-0 z-40 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3.5 flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="p-2 bg-amber-600/20 border border-amber-500/40 rounded-xl text-amber-400">
                    <i data-lucide="layout-dashboard" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="text-xl font-extrabold tracking-tight text-white flex items-center gap-2">
                        חדר עסקאות וניהול צנרת (Deal Room)
                        <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">שמירה אוטומטית פעילה</span>
                    </h1>
                    <p class="text-xs text-gray-300">מעקב וניהול תהליך רכישה מדויק</p>
                </div>
            </div>

            <!-- Top Tools & Actions -->
            <div class="flex items-center gap-2.5 flex-wrap">
                <!-- Free / Custom Property Research Engine (Top Bar) -->
                <button onclick="openCustomResearchModal()" class="flex items-center gap-1.5 px-3.5 py-2 bg-blue-600/20 hover:bg-blue-600/30 text-blue-300 border border-blue-500/40 rounded-xl text-xs font-bold transition">
                    <i data-lucide="microscope" class="w-4 h-4 text-blue-400"></i>
                    <span>🔬 מחקר לנכס חופשי</span>
                </button>

                <!-- Rehab Estimator Tool (Top Bar) -->
                <button onclick="alert('בחר כרטיס עסקה להפעלת מחירון שיפוץ')" class="flex items-center gap-1.5 px-3.5 py-2 bg-amber-600/20 hover:bg-amber-600/30 text-amber-300 border border-amber-500/40 rounded-xl text-xs font-bold transition">
                    <i data-lucide="hammer" class="w-4 h-4 text-amber-400"></i>
                    <span>🔨 מחירון שיפוץ ובקרת קבלנים</span>
                </button>

                <!-- Archive Toggle -->
                <button onclick="toggleArchiveView()" id="btn-toggle-archive" class="flex items-center gap-1.5 px-3.5 py-2 bg-gray-800 hover:bg-gray-700 text-gray-200 border border-gray-700 rounded-xl text-xs font-bold transition">
                    <i data-lucide="archive" class="w-4 h-4 text-amber-400"></i>
                    <span id="archive-btn-text">צפה בארכיון</span>
                    <span id="archive-badge-count" class="px-2 py-0.2 bg-gray-900 rounded-full text-amber-400 font-mono text-[11px]">0</span>
                </button>

                <!-- Back to Scanner -->
                <a href="index.html" target="_blank" class="flex items-center gap-1.5 px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-black shadow-lg shadow-blue-600/20 transition">
                    <i data-lucide="scan" class="w-4 h-4"></i>
                    <span>מעבר לסורק הראשי</span>
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">

        <!-- Top Summary Bar -->
        <section class="grid grid-cols-2 sm:grid-cols-4 gap-3">
            <div class="bg-gray-900/80 border border-gray-800 p-4 rounded-2xl">
                <span class="text-xs font-bold text-gray-400 block mb-1">עסקאות פעילות בצנרת</span>
                <span class="text-2xl font-black text-amber-400" id="deals-total-count">0</span>
            </div>
            <div class="bg-gray-900/80 border border-gray-800 p-4 rounded-2xl">
                <span class="text-xs font-bold text-gray-400 block mb-1">הוגשו הצעות מחיר</span>
                <span class="text-2xl font-black text-blue-400" id="deals-offered-count">0</span>
            </div>
            <div class="bg-gray-900/80 border border-gray-800 p-4 rounded-2xl">
                <span class="text-xs font-bold text-gray-400 block mb-1">עסקאות שנסגרו</span>
                <span class="text-2xl font-black text-emerald-400" id="deals-closed-count">0</span>
            </div>
            <div class="bg-gray-900/80 border border-gray-800 p-4 rounded-2xl">
                <span class="text-xs font-bold text-gray-400 block mb-1">שווי השקעה כולל מבוקש</span>
                <span class="text-2xl font-black text-purple-400" id="deals-total-volume">$0</span>
            </div>
        </section>

        <!-- View Title Indicator -->
        <div class="flex justify-between items-center">
            <h2 class="text-lg font-black text-white flex items-center gap-2" id="view-title">
                <i data-lucide="list-checks" class="w-5 h-5 text-amber-400"></i>
                רשימת עסקאות פעילות
            </h2>
        </div>

        <!-- Deals Container -->
        <section id="pipeline-deals-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Dynamic Deal Cards -->
        </section>

    </main>

    <!-- Custom Property Research Modal (For Properties not in pipeline) -->
    <div id="custom-research-modal" class="fixed inset-0 bg-black/90 backdrop-blur-md z-50 flex items-center justify-center p-3 sm:p-5 hidden">
        <div class="bg-gray-900 border border-blue-500/40 rounded-2xl max-w-lg w-full p-6 space-y-4 shadow-2xl relative text-right">
            <div class="flex justify-between items-center border-b border-gray-800 pb-2.5">
                <h3 class="text-base font-extrabold text-white flex items-center gap-2">
                    <i data-lucide="microscope" class="w-5 h-5 text-blue-400"></i>
                    הפקת דוח מחקר מעמיק לנכס חופשי
                </h3>
                <button onclick="closeCustomResearchModal()" class="text-gray-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>

            <div class="space-y-3 text-xs">
                <div>
                    <label class="block font-bold text-gray-300 mb-1">למי הנכס מיועד (לקוח / שותף):</label>
                    <input type="text" id="cr-target-buyer" placeholder="שם הלקוח..." class="w-full bg-gray-950 border border-gray-700 rounded-lg px-3 py-2 text-white font-bold">
                </div>
                <div>
                    <label class="block font-bold text-gray-300 mb-1">כתובת הנכס:</label>
                    <input type="text" id="cr-address" placeholder="לדוגמה: 1420 Main St" class="w-full bg-gray-950 border border-gray-700 rounded-lg px-3 py-2 text-white font-bold">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block font-bold text-gray-300 mb-1">עיר:</label>
                        <input type="text" id="cr-city" placeholder="לדוגמה: Wilkes-Barre" class="w-full bg-gray-950 border border-gray-700 rounded-lg px-3 py-2 text-white font-bold">
                    </div>
                    <div>
                        <label class="block font-bold text-gray-300 mb-1">מחוז (County):</label>
                        <select id="cr-county" class="w-full bg-gray-950 border border-gray-700 rounded-lg px-3 py-2 text-white font-bold">
                            <option value="Luzerne">Luzerne (מרכז Data Center של אמזון)</option>
                            <option value="Bucks">Bucks (קמפוס AI Falls Twp)</option>
                            <option value="Allegheny">Allegheny (פיטסבורג - רובוטיקה)</option>
                            <option value="Northampton">Northampton (Lehigh Valley Hub)</option>
                            <option value="Lehigh">Lehigh (ייצור מתקדם ולוגיסטיקה)</option>
                            <option value="Washington">Washington (אנרגיה Alpha Compute)</option>
                            <option value="Dauphin">Dauphin (האריסברג)</option>
                            <option value="Berks">Berks (רדינג)</option>
                            <option value="Philadelphia">Philadelphia</option>
                        </select>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block font-bold text-gray-300 mb-1">מחיר מבוקש ($):</label>
                        <input type="number" id="cr-price" placeholder="85000" class="w-full bg-gray-950 border border-gray-700 rounded-lg px-3 py-2 text-emerald-400 font-bold">
                    </div>
                    <div>
                        <label class="block font-bold text-gray-300 mb-1">שטח בנוי (SqFt):</label>
                        <input type="number" id="cr-sqft" placeholder="1250" class="w-full bg-gray-950 border border-gray-700 rounded-lg px-3 py-2 text-white font-bold">
                    </div>
                </div>
            </div>

            <div class="pt-3 border-t border-gray-800 flex justify-between items-center">
                <button onclick="closeCustomResearchModal()" class="px-4 py-2 bg-gray-800 text-gray-300 rounded-xl text-xs font-bold">ביטול</button>
                <button onclick="generateCustomResearch()" class="px-5 py-2 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 text-white rounded-xl text-xs font-black shadow-lg shadow-blue-600/30 flex items-center gap-1.5">
                    <i data-lucide="file-text" class="w-4 h-4"></i> הפק דוח PDF
                </button>
            </div>
        </div>
    </div>

    <!-- Script Logic -->
    <script>
        let pipelineDeals = [];
        let showArchive = false;

        function getDealBadgeStyle(dealType) {
            const dt = (dealType || '').toLowerCase();
            if (dt.includes('sheriff')) return 'bg-rose-500/15 text-rose-300 border-rose-500/40';
            if (dt.includes('foreclosure') || dt.includes('reo')) return 'bg-amber-500/15 text-amber-300 border-amber-500/40';
            if (dt.includes('tax')) return 'bg-purple-500/15 text-purple-300 border-purple-500/40';
            if (dt.includes('probate') || dt.includes('fsbo')) return 'bg-emerald-500/15 text-emerald-300 border-emerald-500/40';
            return 'bg-cyan-500/15 text-cyan-300 border-cyan-500/40';
        }

        async function init() {
            lucide.createIcons();
            loadPipelineDeals();
        }

        function loadPipelineDeals() {
            try {
                const saved = localStorage.getItem('pa_pipeline_deals');
                pipelineDeals = saved ? JSON.parse(saved) : [];
            } catch(e) {
                pipelineDeals = [];
            }
            updateSummaryCounters();
            renderDeals();
        }

        function savePipelineDeals() {
            localStorage.setItem('pa_pipeline_deals', JSON.stringify(pipelineDeals));
            updateSummaryCounters();
            renderDeals();
        }

        function updateSummaryCounters() {
            const activeDeals = pipelineDeals.filter(d => !d.is_archived);
            const archivedDeals = pipelineDeals.filter(d => d.is_archived);

            document.getElementById('deals-total-count').textContent = activeDeals.length;
            document.getElementById('archive-badge-count').textContent = archivedDeals.length;

            const offeredCount = activeDeals.filter(d => d.tracker?.offer_made === 'yes').length;
            document.getElementById('deals-offered-count').textContent = offeredCount;

            const closedCount = activeDeals.filter(d => d.tracker?.deal_closed === 'closed').length;
            document.getElementById('deals-closed-count').textContent = closedCount;

            const totalVol = activeDeals.reduce((sum, d) => sum + (Number(d.price) || 0), 0);
            document.getElementById('deals-total-volume').textContent = '$' + totalVol.toLocaleString();
        }

        function toggleArchiveView() {
            showArchive = !showArchive;
            const btnText = document.getElementById('archive-btn-text');
            const viewTitle = document.getElementById('view-title');
            
            if (showArchive) {
                btnText.textContent = 'חזור לעסקאות פעילות';
                viewTitle.innerHTML = `<i data-lucide="archive" class="w-5 h-5 text-amber-400"></i> ארכיון עסקאות`;
            } else {
                btnText.textContent = 'צפה בארכיון';
                viewTitle.innerHTML = `<i data-lucide="list-checks" class="w-5 h-5 text-amber-400"></i> רשימת עסקאות פעילות`;
            }
            renderDeals();
            lucide.createIcons();
        }

        function updateField(id, key, value) {
            const deal = pipelineDeals.find(d => String(d.id) === String(id));
            if (deal) {
                if (!deal.tracker) deal.tracker = {};
                deal.tracker[key] = value;
                localStorage.setItem('pa_pipeline_deals', JSON.stringify(pipelineDeals));
                updateSummaryCounters();
            }
        }

        function moveToArchive(id) {
            const deal = pipelineDeals.find(d => String(d.id) === String(id));
            if (deal) {
                deal.is_archived = true;
                savePipelineDeals();
            }
        }

        function restoreFromArchive(id) {
            const deal = pipelineDeals.find(d => String(d.id) === String(id));
            if (deal) {
                deal.is_archived = false;
                savePipelineDeals();
            }
        }

        function removeDealCompletely(id) {
            if (confirm("האם להסיר את הנכס לחלוטין מחדר העסקאות? (הנכס יחזור לרשימת הסריקה הראשית)")) {
                pipelineDeals = pipelineDeals.filter(d => String(d.id) !== String(id));
                savePipelineDeals();
            }
        }

        function runDeepResearch(id) {
            const deal = pipelineDeals.find(d => String(d.id) === String(id));
            if (deal && typeof executeDueDiligenceResearch === 'function') {
                executeDueDiligenceResearch(deal);
            }
        }

        function openCustomResearchModal() {
            document.getElementById('custom-research-modal').classList.remove('hidden');
        }

        function closeCustomResearchModal() {
            document.getElementById('custom-research-modal').classList.add('hidden');
        }

        function generateCustomResearch() {
            const customDeal = {
                id: 'custom_' + Date.now(),
                address: document.getElementById('cr-address').value || 'נכס בהתאמה אישית',
                city: document.getElementById('cr-city').value || 'PA Hub',
                county: document.getElementById('cr-county').value || 'Luzerne',
                price: Number(document.getElementById('cr-price').value) || 100000,
                sqft: Number(document.getElementById('cr-sqft').value) || 1200,
                tracker: { target_buyer: document.getElementById('cr-target-buyer').value || 'משקיע כללי' }
            };

            closeCustomResearchModal();
            if (typeof executeDueDiligenceResearch === 'function') {
                executeDueDiligenceResearch(customDeal);
            }
        }

        function renderDeals() {
            const container = document.getElementById('pipeline-deals-grid');
            const displayList = pipelineDeals.filter(d => showArchive ? d.is_archived : !d.is_archived);

            if (displayList.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full text-center py-16 bg-gray-900/40 border border-gray-800 rounded-3xl space-y-3">
                        <i data-lucide="${showArchive ? 'archive' : 'folder-open'}" class="w-12 h-12 text-gray-600 mx-auto"></i>
                        <h3 class="text-base font-bold text-white">${showArchive ? 'אין כרגע עסקאות בארכיון' : 'אין כרגע עסקאות פעילות בחדר העסקאות'}</h3>
                        <p class="text-xs text-gray-400">${showArchive ? 'עסקאות שתעביר לארכיון יוצגו כאן.' : 'העבר נכסים ממערכת הסריקה הראשית כדי לנהל את תהליך הרכישה.'}</p>
                        ${!showArchive ? `
                        <a href="index.html" target="_blank" class="inline-flex items-center gap-1.5 px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-bold transition">
                            <i data-lucide="scan" class="w-4 h-4"></i> עבור למערכת הסריקה
                        </a>` : ''}
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            container.innerHTML = displayList.map((d) => {
                const tr = d.tracker || {};
                const badgeStyle = getDealBadgeStyle(d.deal_type);
                
                return `
                    <div class="bg-gray-900 border border-gray-800 hover:border-amber-500/40 rounded-2xl p-5 shadow-xl flex flex-col justify-between space-y-4">
                        
                        <div class="space-y-3">
                            <!-- Top Field: למי הנכס מיועד -->
                            <div class="flex justify-between items-center gap-2">
                                <div class="bg-gray-950 px-3.5 py-2.5 rounded-xl border border-blue-500/40 flex-1">
                                    <label class="block text-sm font-black text-blue-300 mb-1 flex items-center gap-1.5">
                                        <i data-lucide="user-check" class="w-4 h-4 text-blue-400"></i> למי הנכס מיועד:
                                    </label>
                                    <input type="text" value="${tr.target_buyer || ''}" oninput="updateField('${d.id}', 'target_buyer', this.value)" placeholder="הזן שם לקוח / משקיע / שותף..." class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-1.5 text-base text-white font-extrabold focus:border-blue-400 focus:outline-none">
                                </div>

                                <button onclick="removeDealCompletely('${d.id}')" class="text-gray-500 hover:text-rose-400 p-2.5 bg-gray-950 rounded-xl border border-gray-800 transition" title="הסר מחדר עסקאות">
                                    <i data-lucide="trash-2" class="w-5 h-5"></i>
                                </button>
                            </div>

                            <!-- Property Address & Styled Deal Type Badge matching Scanner -->
                            <div class="pt-1">
                                <div class="flex items-center justify-between gap-2 mb-1">
                                    <h3 class="text-lg font-black text-white">${d.address}</h3>
                                    <span class="px-2.5 py-0.5 rounded-md text-xs font-black uppercase tracking-wider border ${badgeStyle} shrink-0">
                                        ${d.deal_type || 'Opportunity'}
                                    </span>
                                </div>
                                <p class="text-xs font-bold text-gray-300 flex items-center gap-1">
                                    <i data-lucide="map-pin" class="w-3.5 h-3.5 text-blue-400"></i>
                                    ${d.city}, ${d.county} County, PA ${d.zip || ''}
                                </p>
                                <div class="flex justify-between items-center my-1.5">
                                    <div class="text-2xl font-black text-emerald-400">$${(Number(d.price) || 0).toLocaleString()}</div>
                                    
                                    <!-- Research & PDF Report Button -->
                                    <button onclick="runDeepResearch('${d.id}')" class="px-3 py-1.5 bg-blue-600/20 hover:bg-blue-600/40 text-blue-300 border border-blue-500/40 rounded-xl text-xs font-black flex items-center gap-1.5 transition">
                                        <i data-lucide="file-text" class="w-3.5 h-3.5 text-blue-400"></i>
                                        <span>${d.last_researched_at ? '📄 דוח מחקר (מעודכן)' : '🔬 הפק דוח מחקר'}</span>
                                    </button>
                                </div>
                            </div>

                            <!-- Sequential Action Points Tracker -->
                            <div class="space-y-2 pt-2 border-t border-gray-800 text-sm">

                                <!-- 1. מי ראה את הדירה -->
                                <div class="bg-gray-950 p-2.5 rounded-xl border border-gray-800">
                                    <label class="block font-extrabold text-gray-100 mb-1">1. מי ראה את הדירה:</label>
                                    <select onchange="updateField('${d.id}', 'inspector_seen', this.value)" class="w-full bg-gray-900 border border-gray-700 text-white rounded-lg px-2.5 py-1.5 font-bold text-sm">
                                        <option value="none" ${tr.inspector_seen === 'none' || !tr.inspector_seen ? 'selected' : ''}>-- טרם נבדק בשטח --</option>
                                        <option value="agent" ${tr.inspector_seen === 'agent' ? 'selected' : ''}>מתווך</option>
                                        <option value="contractor" ${tr.inspector_seen === 'contractor' ? 'selected' : ''}>קבלן</option>
                                        <option value="handyman" ${tr.inspector_seen === 'handyman' ? 'selected' : ''}>איש אחזקה</option>
                                    </select>
                                </div>

                                <!-- 2. מצב הדירה -->
                                <div class="bg-gray-950 p-2.5 rounded-xl border border-gray-800">
                                    <label class="block font-extrabold text-gray-100 mb-1">2. מצב הדירה:</label>
                                    <select onchange="updateField('${d.id}', 'condition', this.value)" class="w-full bg-gray-900 border border-gray-700 text-white rounded-lg px-2.5 py-1.5 font-bold text-sm">
                                        <option value="" ${!tr.condition ? 'selected' : ''}>-- בחר מצב נכס --</option>
                                        <option value="excellent" ${tr.condition === 'excellent' ? 'selected' : ''}>מעולה</option>
                                        <option value="light_cosmetic" ${tr.condition === 'light_cosmetic' ? 'selected' : ''}>דורש קוסמטיקה קלה</option>
                                        <option value="partial_rehab" ${tr.condition === 'partial_rehab' ? 'selected' : ''}>דורש שיפוץ חלקי</option>
                                        <option value="leaks" ${tr.condition === 'leaks' ? 'selected' : ''}>סובל מנזילות</option>
                                        <option value="full_gut" ${tr.condition === 'full_gut' ? 'selected' : ''}>דורש שיפוץ מלא</option>
                                    </select>
                                </div>

                                <!-- 3. הוגשה הצעה על הנכס -->
                                <div class="bg-gray-950 p-2.5 rounded-xl border border-gray-800 space-y-1">
                                    <label class="block font-extrabold text-gray-100">3. הוגשה הצעה על הנכס:</label>
                                    <div class="grid grid-cols-2 gap-2">
                                        <select onchange="updateField('${d.id}', 'offer_made', this.value)" class="bg-gray-900 border border-gray-700 text-white rounded-lg px-2 py-1.5 font-bold text-sm">
                                            <option value="no" ${tr.offer_made === 'no' || !tr.offer_made ? 'selected' : ''}>לא</option>
                                            <option value="yes" ${tr.offer_made === 'yes' ? 'selected' : ''}>כן</option>
                                        </select>
                                        <input type="number" placeholder="מחיר שהוצע ($)" value="${tr.offer_amount || ''}" oninput="updateField('${d.id}', 'offer_amount', this.value)" class="bg-gray-900 border border-gray-700 text-emerald-400 rounded-lg px-2 py-1.5 font-bold text-sm">
                                    </div>
                                </div>

                                <!-- 4. הפקדת דמי רצינות -->
                                <div class="bg-gray-950 p-2.5 rounded-xl border border-gray-800 space-y-1">
                                    <label class="block font-extrabold text-gray-100">4. הפקדת דמי רצינות (EMD):</label>
                                    <div class="grid grid-cols-2 gap-2">
                                        <select onchange="updateField('${d.id}', 'emd_deposited', this.value)" class="bg-gray-900 border border-gray-700 text-white rounded-lg px-2 py-1.5 font-bold text-sm">
                                            <option value="no" ${tr.emd_deposited === 'no' || !tr.emd_deposited ? 'selected' : ''}>לא</option>
                                            <option value="yes" ${tr.emd_deposited === 'yes' ? 'selected' : ''}>כן</option>
                                        </select>
                                        <input type="number" placeholder="סכום שהופקד ($)" value="${tr.emd_amount || ''}" oninput="updateField('${d.id}', 'emd_amount', this.value)" class="bg-gray-900 border border-gray-700 text-blue-300 rounded-lg px-2 py-1.5 font-bold text-sm">
                                    </div>
                                </div>

                                <!-- 5. נשלח בודק לבית -->
                                <div class="bg-gray-950 p-2.5 rounded-xl border border-gray-800">
                                    <label class="block font-extrabold text-gray-100 mb-1">5. נשלח בודק לבית:</label>
                                    <select onchange="updateField('${d.id}', 'inspector_sent', this.value)" class="w-full bg-gray-900 border border-gray-700 text-white rounded-lg px-2.5 py-1.5 font-bold text-sm">
                                        <option value="no" ${tr.inspector_sent === 'no' || !tr.inspector_sent ? 'selected' : ''}>לא</option>
                                        <option value="yes" ${tr.inspector_sent === 'yes' ? 'selected' : ''}>כן</option>
                                    </select>
                                </div>

                                <!-- 6. הצעת מחיר קבלן שיפוץ -->
                                <div class="bg-gray-950 p-2.5 rounded-xl border border-gray-800 space-y-1">
                                    <label class="block font-extrabold text-gray-100">6. הצעת מחיר קבלן שיפוץ:</label>
                                    <div class="grid grid-cols-2 gap-2">
                                        <select onchange="updateField('${d.id}', 'contractor_quote_status', this.value)" class="bg-gray-900 border border-gray-700 text-white rounded-lg px-2 py-1.5 font-bold text-sm">
                                            <option value="no" ${tr.contractor_quote_status === 'no' || !tr.contractor_quote_status ? 'selected' : ''}>לא</option>
                                            <option value="yes" ${tr.contractor_quote_status === 'yes' ? 'selected' : ''}>כן</option>
                                        </select>
                                        <input type="number" placeholder="סכום ההצעה ($)" value="${tr.contractor_quote_amount || ''}" oninput="updateField('${d.id}', 'contractor_quote_amount', this.value)" class="bg-gray-900 border border-gray-700 text-amber-300 rounded-lg px-2 py-1.5 font-bold text-sm">
                                    </div>
                                </div>

                                <!-- 7. סטטוס העסקה -->
                                <div class="bg-gray-950 p-2.5 rounded-xl border border-gray-800 space-y-1">
                                    <label class="block font-extrabold text-gray-100">7. סטטוס העסקה:</label>
                                    <div class="grid grid-cols-2 gap-2">
                                        <select onchange="updateField('${d.id}', 'deal_status', this.value)" class="bg-gray-900 border border-gray-700 text-white rounded-lg px-2 py-1.5 font-bold text-sm">
                                            <option value="under_review" ${tr.deal_status === 'under_review' || !tr.deal_status ? 'selected' : ''}>בבדיקה</option>
                                            <option value="negotiating_new_price" ${tr.deal_status === 'negotiating_new_price' ? 'selected' : ''}>משא ומתן במחיר חדש</option>
                                            <option value="awaiting_client" ${tr.deal_status === 'awaiting_client' ? 'selected' : ''}>ממתין לתשובת הלקוח</option>
                                        </select>
                                        <input type="number" placeholder="מחיר במו&quot;מ ($)" value="${tr.negotiated_price || ''}" oninput="updateField('${d.id}', 'negotiated_price', this.value)" class="bg-gray-900 border border-gray-700 text-purple-300 rounded-lg px-2 py-1.5 font-bold text-sm">
                                    </div>
                                </div>

                                <!-- 8. נסגרה עסקה -->
                                <div class="bg-gray-950 p-2.5 rounded-xl border border-gray-800 space-y-1">
                                    <label class="block font-extrabold text-gray-100">8. סגירת עסקה:</label>
                                    <div class="grid grid-cols-2 gap-2">
                                        <select onchange="updateField('${d.id}', 'deal_closed', this.value)" class="bg-gray-900 border border-gray-700 text-white rounded-lg px-2 py-1.5 font-bold text-sm">
                                            <option value="" ${!tr.deal_closed ? 'selected' : ''}>-- בחר סטטוס --</option>
                                            <option value="not_closed" ${tr.deal_closed === 'not_closed' ? 'selected' : ''}>לא נסגרה עסקה</option>
                                            <option value="closed" ${tr.deal_closed === 'closed' ? 'selected' : ''}>נסגרה עסקה</option>
                                        </select>
                                        <input type="number" placeholder="מחיר סגירה ($)" value="${tr.final_closing_price || ''}" oninput="updateField('${d.id}', 'final_closing_price', this.value)" class="bg-gray-900 border border-gray-700 text-emerald-400 rounded-lg px-2 py-1.5 font-bold text-sm">
                                    </div>
                                </div>

                            </div>
                        </div>

                        <!-- 9. כפתור העברה לארכיון / שחזור -->
                        <div class="pt-2 border-t border-gray-800">
                            ${showArchive ? `
                                <button onclick="restoreFromArchive('${d.id}')" class="w-full py-2.5 bg-gray-800 hover:bg-gray-700 text-emerald-300 border border-emerald-500/30 rounded-xl text-sm font-bold flex items-center justify-center gap-2 transition">
                                    <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                                    <span>החזר לעסקאות פעילות</span>
                                </button>
                            ` : `
                                <button onclick="moveToArchive('${d.id}')" class="w-full py-2.5 bg-gray-800 hover:bg-gray-700 text-amber-300 border border-gray-700 rounded-xl text-sm font-bold flex items-center justify-center gap-2 transition">
                                    <i data-lucide="archive" class="w-4 h-4"></i>
                                    <span>9. העבר לארכיון</span>
                                </button>
                            `}
                        </div>
                    </div>
                `;
            }).join('');

            lucide.createIcons();
        }

        window.onload = init;
    </script>

    <!-- Connect External Modules -->
    <script src="research_engine.js"></script>
</body>
</html>
