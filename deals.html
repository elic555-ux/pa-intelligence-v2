<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>חדר עסקאות - PA Real Estate Intelligence Hub</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- HTML2PDF Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <!-- PDF.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800;900&display=swap');
        body {
            font-family: 'Assistant', sans-serif;
            background-color: #0b0f19;
            color: #f9fafb;
        }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #111827; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #374151; border-radius: 3px; }

        .indicator-pending {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background-color: #374151;
            border: 2px solid #9ca3af;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        
        .indicator-done {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background-color: #10b981;
            border: 2px solid #34d399;
            color: #064e3b;
            font-weight: 900;
            font-size: 11px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 0 8px rgba(16, 185, 129, 0.5);
        }

        #inspection-report-printable-area {
            background-color: #ffffff !important;
            color: #111827 !important;
        }
        #inspection-report-printable-area * {
            color: #111827 !important;
        }
        #inspection-report-printable-area .text-highlight-red {
            color: #991b1b !important;
            font-weight: 900 !important;
        }
        #inspection-report-printable-area .text-highlight-green {
            color: #065f46 !important;
            font-weight: 900 !important;
        }
        #inspection-report-printable-area .text-highlight-amber {
            color: #92400e !important;
            font-weight: 900 !important;
        }
        #inspection-report-printable-area table th {
            background-color: #f3f4f6 !important;
            color: #000000 !important;
            font-weight: 900 !important;
            border-bottom: 2px solid #9ca3af !important;
        }
        #inspection-report-printable-area table td {
            border-bottom: 1px solid #d1d5db !important;
            color: #111827 !important;
            font-size: 15px !important;
            line-height: 1.6 !important;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased">

    <!-- Header -->
    <header class="bg-gray-900/90 border-b border-gray-800 sticky top-0 z-40 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3.5 flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="p-2 bg-amber-600/20 border border-amber-500/40 rounded-xl text-amber-400">
                    <i data-lucide="layout-dashboard" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="text-xl font-extrabold tracking-tight text-white flex items-center gap-2">
                        חדר עסקאות וניהול צנרת (Deal Room)
                        <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">ניהול וסריקה פעילים</span>
                    </h1>
                    <p class="text-xs text-gray-300">מעקב, הערכת שיפוצים וניתוח דוחות בודק</p>
                </div>
            </div>

            <div class="flex items-center gap-2.5 flex-wrap">
                <button onclick="openCustomResearchModal()" class="flex items-center gap-1.5 px-3.5 py-2 bg-blue-600/20 hover:bg-blue-600/30 text-blue-300 border border-blue-500/40 rounded-xl text-xs font-bold transition">
                    <i data-lucide="microscope" class="w-4 h-4 text-blue-400"></i>
                    <span>🔬 מחקר לנכס חופשי</span>
                </button>

                <button onclick="openGeneralPriceCatalogModal()" class="flex items-center gap-1.5 px-4 py-2 bg-gradient-to-r from-amber-600 to-orange-600 hover:from-amber-500 text-white rounded-xl text-xs font-black shadow-lg shadow-amber-600/20 transition">
                    <i data-lucide="hammer" class="w-4 h-4"></i>
                    <span>🔨 מחירון ובדיקת דוחות חופשית</span>
                </button>

                <button onclick="toggleArchiveView()" id="btn-toggle-archive" class="flex items-center gap-1.5 px-3.5 py-2 bg-gray-800 hover:bg-gray-700 text-gray-200 border border-gray-700 rounded-xl text-xs font-bold transition">
                    <i data-lucide="archive" class="w-4 h-4 text-amber-400"></i>
                    <span id="archive-btn-text">צפה בארכיון</span>
                    <span id="archive-badge-count" class="px-2 py-0.2 bg-gray-900 rounded-full text-amber-400 font-mono text-[11px]">0</span>
                </button>

                <a href="index.html" target="pa_scanner" class="flex items-center gap-1.5 px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-black shadow-lg shadow-blue-600/20 transition">
                    <i data-lucide="scan" class="w-4 h-4"></i>
                    <span>מעבר לסורק הראשי</span>
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">
        
        <!-- Top Metrics -->
        <section class="grid grid-cols-2 sm:grid-cols-4 gap-3">
            <div class="bg-gray-900/80 border border-gray-800 p-4 rounded-2xl flex items-center justify-between">
                <div>
                    <span class="text-xs font-bold text-gray-400 block mb-1">עסקאות פעילות בצנרת</span>
                    <span class="text-2xl font-black text-amber-400" id="deals-total-count">0</span>
                </div>
                <div class="p-2.5 bg-amber-500/10 rounded-xl text-amber-400"><i data-lucide="building-2" class="w-6 h-6"></i></div>
            </div>

            <div class="bg-gray-900/80 border border-gray-800 p-4 rounded-2xl flex items-center justify-between">
                <div>
                    <span class="text-xs font-bold text-gray-400 block mb-1">הוגשו הצעות מחיר</span>
                    <span class="text-2xl font-black text-blue-400" id="deals-offered-count">0</span>
                </div>
                <div class="p-2.5 bg-blue-500/10 rounded-xl text-blue-400"><i data-lucide="send" class="w-6 h-6"></i></div>
            </div>

            <div class="bg-gray-900/80 border border-gray-800 p-4 rounded-2xl flex items-center justify-between">
                <div>
                    <span class="text-xs font-bold text-gray-400 block mb-1">עסקאות שנסגרו</span>
                    <span class="text-2xl font-black text-purple-400" id="deals-closed-count">0</span>
                </div>
                <div class="p-2.5 bg-purple-500/10 rounded-xl text-purple-400"><i data-lucide="check-circle" class="w-5 h-5"></i></div>
            </div>

            <div onclick="openSavedReportsModal()" class="bg-gray-900/80 border border-emerald-500/30 hover:border-emerald-400 p-4 rounded-2xl flex items-center justify-between cursor-pointer transition shadow-lg hover:shadow-emerald-950/40">
                <div>
                    <span class="text-xs font-bold text-gray-300 block mb-1 flex items-center gap-1">
                        דוחות בודק שנשמרו
                        <i data-lucide="external-link" class="w-3 h-3 text-emerald-400"></i>
                    </span>
                    <span class="text-2xl font-black text-emerald-400" id="reports-saved-count">0</span>
                </div>
                <div class="p-2.5 bg-emerald-500/10 rounded-xl text-emerald-400"><i data-lucide="file-check-2" class="w-6 h-6"></i></div>
            </div>
        </section>

        <!-- Saved Custom Researches Area -->
        <section id="custom-researches-container" class="hidden bg-gray-900/70 border border-blue-500/30 rounded-2xl p-4 space-y-2.5">
            <h3 class="text-sm font-black text-blue-300 flex items-center gap-1.5">
                <i data-lucide="file-text" class="w-4 h-4 text-blue-400"></i>
                📑 מחקרים חופשיים שמורים
            </h3>
            <div id="custom-researches-list" class="space-y-1.5"></div>
        </section>

        <!-- Active Pipeline Header -->
        <div class="flex justify-between items-center">
            <h2 class="text-lg font-black text-white flex items-center gap-2" id="view-title">
                <i data-lucide="list-checks" class="w-5 h-5 text-amber-400"></i>
                רשימת עסקאות בצנרת
            </h2>
        </div>

        <!-- Pipeline Cards Grid -->
        <section id="pipeline-deals-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></section>

    </main>

    <!-- Modal: Saved Inspection Reports Viewer Modal -->
    <div id="saved-reports-modal" class="fixed inset-0 bg-black/90 backdrop-blur-md z-50 flex items-center justify-center p-3 sm:p-5 hidden">
        <div class="bg-gray-900 border border-emerald-500/40 rounded-2xl max-w-3xl w-full p-6 space-y-4 shadow-2xl relative text-right max-h-[90vh] overflow-y-auto custom-scrollbar">
            <div class="flex justify-between items-center border-b border-gray-800 pb-2.5">
                <h3 class="text-base font-extrabold text-white flex items-center gap-2">
                    <i data-lucide="file-check-2" class="w-5 h-5 text-emerald-400"></i>
                    דוחות בודק שנבדקו ונשמרו בהיסטוריה
                </h3>
                <div class="flex items-center gap-3">
                    <button onclick="clearSavedReports()" class="text-xs text-gray-500 hover:text-rose-400 transition">נקה היסטוריה</button>
                    <button onclick="closeSavedReportsModal()" class="text-gray-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
                </div>
            </div>

            <div id="saved-reports-modal-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-3"></div>

            <div class="pt-2 border-t border-gray-800 text-left">
                <button onclick="closeSavedReportsModal()" class="px-4 py-1.5 bg-gray-800 text-gray-300 rounded-lg text-xs font-bold">סגור</button>
            </div>
        </div>
    </div>

    <!-- Script Logic -->
    <script>
        let pipelineDeals = [];
        let savedInspectionReports = [];
        let savedCustomResearches = [];
        let showArchive = false;
        let activeInspectionData = null;
        let currentResearchProperty = null;

        const COUNTY_AI_MACRO_DATA = {
            "Allegheny": { tier: "Tier A", aiScore: 90, growthDriver: "אקוסיסטם רובוטיקה ואוניברסיטאות AI (פיטסבורג)", permitStatus: "High-Tech Growth Hub", rentDemand: "יציב וחיובי", medianRent: "$1,450", safetyGrade: "B", schoolsGrade: "8/10", marketTrend: "+4.5% שנתי" },
            "Luzerne": { tier: "Tier A", aiScore: 95, growthDriver: "מתחם חוות שרתים ענק של אמזון ($20B)", permitStatus: "Permitted & Powered", rentDemand: "גבוה מאוד", medianRent: "$1,550", safetyGrade: "B+", schoolsGrade: "7/10", marketTrend: "+6.8% שנתי" },
            "Philadelphia": { tier: "Tier A", aiScore: 89, growthDriver: "מרכז רפואי, ביוטק ואוניברסיטאות", permitStatus: "Metro Core Hub", rentDemand: "גבוה מאוד", medianRent: "$1,750", safetyGrade: "B", schoolsGrade: "7.5/10", marketTrend: "+5.0% שנתי" }
        };
        const DEFAULT_MACRO_DATA = { tier: "Tier B", aiScore: 75, growthDriver: "כלכלה אזורית מעורבת בפנסילבניה", permitStatus: "Standard Review", rentDemand: "ממוצע ויציב", medianRent: "$1,350", safetyGrade: "B", schoolsGrade: "7/10", marketTrend: "+3.8% שנתי" };

        const PA_CITY_HOODS = {
            "Pittsburgh": ["Downtown", "Shadyside", "Lawrenceville", "Squirrel Hill", "South Side", "Oakland", "Homestead"],
            "Philadelphia": ["Center City", "Fishtown", "Northern Liberties", "South Philly"],
            "Allentown": ["Downtown", "West End"],
            "Reading": ["Center City", "Northeast"],
            "Wilkes-Barre": ["Downtown", "South Wilkes-Barre"],
            "Scranton": ["Downtown", "Hill Section"],
            "Erie": ["Downtown", "Bayfront"],
            "Bethlehem": ["Historic District", "South Side"],
            "Lancaster": ["Downtown", "Chestnut Hill"],
            "Harrisburg": ["Downtown", "Midtown"],
            "York": ["Downtown", "Avenues"],
            "Altoona": ["Downtown", "Gospel Hill"]
        };
        const CITY_COUNTY_MAP = { "Pittsburgh": "Allegheny", "Philadelphia": "Philadelphia", "Wilkes-Barre": "Luzerne", "Reading": "Berks" };
        const CITY_DEFAULT_PRICES = { "Pittsburgh": 140000, "Philadelphia": 160000, "Wilkes-Barre": 85000, "Reading": 110000 };
        const CITY_COST_MULTIPLIER = { "Pittsburgh": 1.15, "Homestead": 1.15, "Philadelphia": 1.25, "Allentown": 1.12, "Reading": 1.00, "Wilkes-Barre": 1.00, "Scranton": 0.98, "Erie": 0.95 };

        async function init() {
            loadSavedReports();
            loadSavedCustomResearches();
            loadPipelineDeals();

            // Real-time synchronization across tabs/windows
            window.addEventListener('storage', function(e) {
                if (e.key === 'pa_pipeline_deals') {
                    loadPipelineDeals();
                }
            });
        }

        function renderV(isDone) {
            return isDone ? `<span class="indicator-done">✓</span>` : `<span class="indicator-pending"></span>`;
        }

        function calculateAccurateRehab(deal) {
            const tr = deal.tracker || {};
            const text = ((deal.address || '') + ' ' + (deal.notes || '') + ' ' + (deal.description || '')).toLowerCase();
            const sqft = Number(deal.sqft) > 0 ? Number(deal.sqft) : 1300;
            const cond = tr.condition || deal.condition || '';
            let minRehab = 0, maxRehab = 0;
            if (text.includes('roof') || text.includes('גג') || text.includes('leak') || cond === 'leaks') { minRehab += 6500; maxRehab += 9500; }
            if (text.includes('paint') || text.includes('צבע') || text.includes('cosmetic') || cond === 'light_cosmetic') { const c = Math.round(sqft * 2.0); minRehab += c; maxRehab += Math.round(c * 1.35); }
            if (cond === 'full_gut' || text.includes('gut') || text.includes('rehab')) { minRehab += Math.round(sqft * 42); maxRehab += Math.round(sqft * 58); }
            if (minRehab === 0) {
                if (cond === 'excellent') return { range: "$0 – $2,500", details: "נכס במצב מעולה – דורש ניקיון בלבד" };
                return { range: "$4,500 – $8,500", details: "לא זוהו ליקויים כבדים – אומדן תחזוקה וקוסמטיקה קלה" };
            }
            return { range: `$${minRehab.toLocaleString()} – $${maxRehab.toLocaleString()}`, details: "אומדן אוטומטי מבוסס מאפיינים" };
        }

        function updateField(id, key, value) {
            const deal = pipelineDeals.find(d => String(d.id) === String(id));
            if (deal) {
                if (!deal.tracker) deal.tracker = {};
                deal.tracker[key] = value;
                localStorage.setItem('pa_pipeline_deals', JSON.stringify(pipelineDeals));
                loadPipelineDeals();
            }
        }

        function moveToArchive(id) {
            const deal = pipelineDeals.find(d => String(d.id) === String(id));
            if (deal) { deal.is_archived = true; localStorage.setItem('pa_pipeline_deals', JSON.stringify(pipelineDeals)); loadPipelineDeals(); }
        }

        function restoreFromArchive(id) {
            const deal = pipelineDeals.find(d => String(d.id) === String(id));
            if (deal) { deal.is_archived = false; localStorage.setItem('pa_pipeline_deals', JSON.stringify(pipelineDeals)); loadPipelineDeals(); }
        }

        function removeDealCompletely(id) {
            if (confirm("האם להסיר את הנכס לחלוטין מחדר העסקאות?")) {
                pipelineDeals = pipelineDeals.filter(d => String(d.id) !== String(id));
                localStorage.setItem('pa_pipeline_deals', JSON.stringify(pipelineDeals));
                loadPipelineDeals();
            }
        }

        function toggleArchiveView() {
            showArchive = !showArchive;
            document.getElementById('archive-btn-text').textContent = showArchive ? 'חזור לעסקאות פעילות' : 'צפה בארכיון';
            document.getElementById('view-title').innerHTML = showArchive 
                ? `<i data-lucide="archive" class="w-5 h-5 text-amber-400"></i> ארכיון עסקאות`
                : `<i data-lucide="list-checks" class="w-5 h-5 text-amber-400"></i> רשימת עסקאות בצנרת`;
            renderDeals();
        }

        function loadPipelineDeals() {
            try { pipelineDeals = JSON.parse(localStorage.getItem('pa_pipeline_deals')) || []; } catch(e) { pipelineDeals = []; }
            const active = pipelineDeals.filter(d => !d.is_archived);
            document.getElementById('deals-total-count').textContent = active.length;
            document.getElementById('archive-badge-count').textContent = pipelineDeals.filter(d => d.is_archived).length;
            document.getElementById('deals-offered-count').textContent = active.filter(d => d.tracker?.offer_made === 'yes').length;
            document.getElementById('deals-closed-count').textContent = active.filter(d => d.tracker?.deal_closed === 'closed').length;
            renderDeals();
        }

        function renderDeals() {
            const container = document.getElementById('pipeline-deals-grid');
            if (!container) return;
            const displayList = pipelineDeals.filter(d => showArchive ? d.is_archived : !d.is_archived);

            if (displayList.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center py-16 bg-gray-900/40 border border-gray-800 rounded-3xl text-gray-400 text-xs font-bold">אין כרגע עסקאות ברשימת הצנרת. כל דוחות הבודק שתסרוק נשמרים ישירות בבלוק העליון.</div>`;
                lucide.createIcons();
                return;
            }

            container.innerHTML = displayList.map((d) => {
                const tr = d.tracker || {};
                const rehabEstimate = calculateAccurateRehab(d);
                return `
                    <div class="bg-gray-900 border border-gray-800 hover:border-amber-500/40 rounded-2xl p-5 shadow-xl flex flex-col justify-between space-y-4">
                        <div class="space-y-3">
                            <div class="flex justify-between items-center gap-2">
                                <div class="bg-gray-950 px-3.5 py-2.5 rounded-xl border border-blue-500/40 flex-1">
                                    <label class="block text-sm font-black text-blue-300 mb-1 flex items-center gap-1.5">
                                        <i data-lucide="user-check" class="w-4 h-4 text-blue-400"></i> למי הנכס מיועד:
                                    </label>
                                    <input type="text" value="${tr.target_buyer || ''}" oninput="updateField('${d.id}', 'target_buyer', this.value)" placeholder="הזן שם לקוח..." class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-1.5 text-base text-white font-extrabold focus:outline-none">
                                </div>
                                <button onclick="removeDealCompletely('${d.id}')" class="text-gray-500 hover:text-rose-400 p-2.5 bg-gray-950 rounded-xl border border-gray-800 transition" title="הסר">
                                    <i data-lucide="trash-2" class="w-5 h-5"></i>
                                </button>
                            </div>
                            <div>
                                <h3 class="text-lg font-black text-white">${d.address}</h3>
                                <p class="text-xs font-bold text-gray-300">${d.city}, PA</p>
                                <div class="text-2xl font-black text-emerald-400 my-2">$${(Number(d.price) || 0).toLocaleString()}</div>
                            </div>
                        </div>
                        <div class="pt-2 border-t border-gray-800">
                            ${showArchive ? `
                                <button onclick="restoreFromArchive('${d.id}')" class="w-full py-2.5 bg-gray-800 text-emerald-300 border rounded-xl text-sm font-bold">החזר לעסקאות פעילות</button>
                            ` : `
                                <button onclick="moveToArchive('${d.id}')" class="w-full py-2.5 bg-gray-800 text-amber-300 border rounded-xl text-sm font-bold">העבר לארכיון</button>
                            `}
                        </div>
                    </div>
                `;
            }).join('');
            lucide.createIcons();
        }

        function loadSavedReports() {
            try { savedInspectionReports = JSON.parse(localStorage.getItem('pa_saved_inspection_reports')) || []; } catch(e) { savedInspectionReports = []; }
            const counter = document.getElementById('reports-saved-count');
            if (counter) counter.textContent = savedInspectionReports.length;
        }

        function loadSavedCustomResearches() {
            try { savedCustomResearches = JSON.parse(localStorage.getItem('pa_custom_researches')) || []; } catch(e) { savedCustomResearches = []; }
        }

        window.onload = init;
    </script>
</body>
</html>
