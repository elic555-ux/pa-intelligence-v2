name: Preview Environment Validation
on:
  pull_request:
    paths:
      - 'preview/**'
      - 'tools/preview/**'
      - '.github/workflows/preview-validation.yml'
permissions:
  contents: read
concurrency:
  group: preview-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned preview source
        id: source
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          sha = json.loads(Path('tools/preview/manifest.json').read_text())['source_sha']
          assert re.fullmatch('[0-9a-f]{40}', sha)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('sha=' + sha + '\n')
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          path: .preview-source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify deterministic build and isolated clients
        run: |
          python tools/preview/build.py --source .preview-source --output .preview-check
          python - <<'PY'
          from pathlib import Path
          expected = Path('preview')
          built = Path('.preview-check')
          for file in built.rglob('*'):
              if file.is_file():
                  assert file.read_bytes() == (expected / file.relative_to(built)).read_bytes(), str(file)
          PY
          node tools/preview/test-runtime.cjs
      - name: Install browser test dependency
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verify preview in Chromium
        run: |
          python -m http.server 8765 >/tmp/preview-http.log 2>&1 &
          python tools/preview/browser-test.py
