<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PA Counties Map</title>
    <!-- Leaflet Map CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@600;800&display=swap');
        
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Assistant', sans-serif; background-color: #f8fafc; }
        #map { height: 100vh; width: 100vw; z-index: 1; }

        .county-label {
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            color: #000000 !important;
            font-size: 11px;
            font-weight: 800;
            text-align: center;
            text-shadow: 
                -1px -1px 0 #ffffff,  
                 1px -1px 0 #ffffff,
                -1px  1px 0 #ffffff,
                 1px  1px 0 #ffffff; 
        }
        .county-label::before { display: none !important; }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map', { zoomControl: true }).setView([40.9, -77.5], 7);

        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri',
            maxZoom: 16
        }).addTo(map);

        // ==========================================
        // אזור הגדרות הצבעים (Config) - השליטה שלך!
        // ==========================================
        const countyColors = {
            // "Allegheny": "lightblue",
            // "Philadelphia": "#dbeafe"
        };

        const defaultFillColor = "#ffffff"; 
        const outlineColor = "#ff4d4f";     
        const outlineWeight = 1.5;          

        // טעינת מפת פנסילבניה ממקור גיבוי ישיר ואמין לחלוטין
        const backupGeoJsonUrl = 'https://raw.githubusercontent.com/OpenDataDE/state-legislative-geojson/master/pa/pa_counties.geojson';

        fetch(backupGeoJsonUrl)
            .then(res => res.json())
            .then(data => {
                L.geoJSON(data, {
                    style: function (feature) {
                        // זיהוי שם המחוז מתוך נתוני הגיבוי
                        let rawName = feature.properties.NAME || feature.properties.name || "";
                        let cleanName = rawName.replace(' County', '').trim();
                        
                        let fillColor = countyColors[cleanName] || defaultFillColor;
                        
                        return {
                            color: outlineColor,   
                            weight: outlineWeight, 
                            opacity: 1,            
                            fillColor: fillColor,  
                            fillOpacity: 1         
                        };
                    },
                    onEachFeature: function (feature, layer) {
                        let rawName = feature.properties.NAME || feature.properties.name || "";
                        let cleanName = rawName.replace(' County', '').trim();

                        layer.bindTooltip(cleanName, {
                            permanent: true,
                            direction: 'center',
                            className: 'county-label'
                        });
                    }
                }).addTo(map);
            })
            .catch(err => {
                console.error("Error loading map:", err);
                alert("שגיאה בטעינת נתוני המפה. ודא חיבור לאינטרנט.");
            });
    </script>
</body>
</html>
