<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PA Real Estate Intelligence Map - Mission Control</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet Map CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap');
        body { font-family: 'Assistant', sans-serif; background-color: #0b0f19; color: #f3f4f6; overflow: hidden; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #111827; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #374151; border-radius: 3px; }
        
        #map { height: calc(100vh - 73px); width: 100%; z-index: 10; background-color: #0f172a; }
        
        .county-label {
            background: rgba(15, 23, 42, 0.85) !important;
            border: 1px solid #3b82f6 !important;
            color: #ffffff !important;
            padding: 2px 6px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 800;
            text-align: center;
        }
        .county-label::before { display: none !important; }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased">

    <!-- Header -->
    <header class="bg-gray-900/90 border-b border-gray-800 sticky top-0 z-40 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="p-2 bg-blue-600/20 border border-blue-500/40 rounded-xl text-blue-400">
                    <i data-lucide="map" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="text-xl font-extrabold tracking-tight text-white flex items-center gap-2">
                        מפת מודיעין נדל"ן ארצית (PA Map Dashboard)
                        <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">67 מחוזות אינטראקטיביים</span>
                    </h1>
                    <p class="text-xs text-gray-400">ניתוח גיאוגרפי, פילוח הזדמנויות וחיבור ישיר למנוע הסריקה</p>
                </div>
            </div>

            <div class="flex items-center gap-2">
                <a href="index.html" class="flex items-center gap-1.5 px-4 py-2 bg-gray-800 hover:bg-gray-700 text-gray-200 rounded-xl text-xs font-bold transition">
                    <i data-lucide="scan" class="w-4 h-4 text-blue-400"></i> חזרה לסורק הראשי
                </a>
                <a href="deals.html" target="deals_tab" class="flex items-center gap-1.5 px-4 py-2 bg-amber-600 hover:bg-amber-500 text-white rounded-xl text-xs font-black transition shadow-lg shadow-amber-600/20">
                    <i data-lucide="layout-dashboard" class="w-4 h-4"></i> חדר עסקאות
                </a>
            </div>
        </div>
    </header>

    <!-- Main Workspace Layout -->
    <div class="flex-1 flex overflow-hidden">
        
        <!-- Left Sidebar: Filters & County Intelligence -->
        <aside class="w-96 bg-gray-900/95 border-l border-gray-800 flex flex-col z-20 shadow-2xl">
            <div class="p-4 border-b border-gray-800 space-y-3">
                <h2 class="text-sm font-black text-amber-400 flex items-center gap-1.5">
                    <i data-lucide="filter" class="w-4 h-4"></i> פילטרים וסינון מפה ארצי
                </h2>
                
                <!-- Filters Form -->
                <div class="space-y-2.5 text-xs">
                    <div>
                        <label class="block font-bold text-gray-300 mb-1">סוג עסקה / סקטור:</label>
                        <select id="filter-sector" onchange="applyMapFilters()" class="w-full bg-gray-950 border border-gray-700 rounded-lg px-3 py-2 text-white font-bold">
                            <option value="all">כל הסקטורים (הכל)</option>
                            <option value="foreclosure">Foreclosure / REO (בנקים)</option>
                            <option value="tax">Tax Delinquent (פיגורי מס)</option>
                            <option value="estate">Probate & Estates (עיזבונות)</option>
                            <option value="sheriff">Sheriff Sale (שריף)</option>
                            <option value="mls">MLS & Price Drops (רגיל)</option>
                        </select>
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block font-bold text-gray-300 mb-1">מחיר מינימום:</label>
                            <input type="number" id="filter-min-p" oninput="applyMapFilters()" placeholder="50,000" class="w-full bg-gray-950 border border-gray-700 rounded-lg px-2.5 py-1.5 text-emerald-400 font-mono font-bold">
                        </div>
                        <div>
                            <label class="block font-bold text-gray-300 mb-1">מחיר מקסימום:</label>
                            <input type="number" id="filter-max-p" oninput="applyMapFilters()" placeholder="250,000" class="w-full bg-gray-950 border border-gray-700 rounded-lg px-2.5 py-1.5 text-emerald-400 font-mono font-bold">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Active County Details Box -->
            <div id="county-inspector" class="flex-1 overflow-y-auto custom-scrollbar p-4 space-y-4">
                <div class="text-center py-12 text-gray-500 text-xs font-bold">
                    <i data-lucide="mouse-pointer-click" class="w-8 h-8 mx-auto mb-2 opacity-40"></i>
                    לחץ על מחוז כלשהו במפה כדי לראות ניתוח מלא של נכסים, מחירים והזדמנויות.
                </div>
            </div>
        </aside>

        <!-- Right Side: Interactive Map Container -->
        <main class="flex-1 relative">
            <div id="map"></div>
        </main>

    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let map;
        let allProperties = [];
        let geoJsonLayer = null;
        let selectedCountyName = null;

        async function initMapDashboard() {
            lucide.createIcons();

            // אתחול המפה
            map = L.map('map', { zoomControl: false }).setView([40.9, -77.5], 7);
            L.control.zoom({ position: 'topleft' }).addTo(map);

            L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
                attribution: 'Tiles &copy; Esri',
                maxZoom: 16
            }).addTo(map);

            // טעינת נתוני הנכסים מהסורק שלך
            try {
                const res = await fetch('properties.json?t=' + Date.now());
                allProperties = await res.json();
            } catch(e) {
                console.warn("Could not load properties.json, using empty dataset.");
                allProperties = [];
            }

            loadPennsylvaniaCountiesMap();
        }

        function loadPennsylvaniaCountiesMap() {
            // טעינת גבולות המחוזות מגיבוי פנימי מובטח
            const countiesGeoJsonUrl = 'https://raw.githubusercontent.com/OpenDataDE/state-legislative-geojson/master/pa/pa_counties.geojson';

            fetch(countiesGeoJsonUrl)
                .then(res => res.json())
                .then(geoData => {
                    renderMapLayer(geoData);
                })
                .catch(err => {
                    console.error("Error loading map shapes:", err);
                });
        }

        function renderMapLayer(geoData) {
            if (geoJsonLayer) map.removeLayer(geoJsonLayer);

            const sectorFilter = document.getElementById('filter-sector').value;
            const minP = Number(document.getElementById('filter-min-p').value) || 0;
            const maxP = Number(document.getElementById('filter-max-p').value) || 99999999;

            geoJsonLayer = L.geoJSON(geoData, {
                style: function(feature) {
                    const countyName = (feature.properties.NAME || feature.properties.name || '').replace(' County', '').trim();
                    
                    // סינון נכסים ששייכים למחוז זה
                    const countyProps = allProperties.filter(p => {
                        const matchCounty = (p.county || '').toLowerCase().includes(countyName.toLowerCase());
                        const matchPrice = (Number(p.price) || 0) >= minP && (Number(p.price) || 0) <= (maxP || 999999);
                        let matchSector = true;
                        if (sectorFilter !== 'all') {
                            matchSector = (p.deal_type || '').toLowerCase().includes(sectorFilter);
                        }
                        return matchCounty && matchPrice && matchSector;
                    });

                    const count = countyProps.length;
                    
                    // קביעת צבע דינמי לפי כמות ההזדמנויות במחוז
                    let fillColor = '#1e293b'; // ברירת מחדל חשוכה
                    if (count > 5) fillColor = '#047857'; // ירוק - שפע הזדמנויות
                    else if (count > 2) fillColor = '#b45309'; // כתום - בינוני
                    else if (count > 0) fillColor = '#1d4ed8'; // כחול - מעט

                    const isSelected = selectedCountyName === countyName;

                    return {
                        color: isSelected ? '#fbbf24' : '#475569',
                        weight: isSelected ? 3 : 1,
                        fillColor: fillColor,
                        fillOpacity: 0.65
                    };
                },
                onEachFeature: function(feature, layer) {
                    const countyName = (feature.properties.NAME || feature.properties.name || '').replace(' County', '').trim();

                    // הצגת שם המחוז על המפה
                    layer.bindTooltip(countyName, {
                        permanent: true,
                        direction: 'center',
                        className: 'county-label'
                    });

                    // אירוע לחיצה על מחוז במפה
                    layer.on('click', function() {
                        selectedCountyName = countyName;
                        renderMapLayer(geoData); // רענון עיצוב המפה
                        inspectCounty(countyName);
                    });
                }
            }).addTo(map);
        }

        function applyMapFilters() {
            loadPennsylvaniaCountiesMap();
        }

        function inspectCounty(countyName) {
            const inspector = document.getElementById('county-inspector');
            const sectorFilter = document.getElementById('filter-sector').value;
            const minP = Number(document.getElementById('filter-min-p').value) || 0;
            const maxP = Number(document.getElementById('filter-max-p').value) || 99999999;

            const countyProps = allProperties.filter(p => {
                const matchCounty = (p.county || '').toLowerCase().includes(countyName.toLowerCase());
                const matchPrice = (Number(p.price) || 0) >= minP && (Number(p.price) || 0) <= (maxP || 999999);
                let matchSector = true;
                if (sectorFilter !== 'all') {
                    matchSector = (p.deal_type || '').toLowerCase().includes(sectorFilter);
                }
                return matchCounty && matchPrice && matchSector;
            });

            const foreclosures = countyProps.filter(p => (p.deal_type || '').toLowerCase().includes('foreclosure') || (p.deal_type || '').toLowerCase().includes('reo')).length;
            const taxSales = countyProps.filter(p => (p.deal_type || '').toLowerCase().includes('tax')).length;
            const estates = countyProps.filter(p => (p.deal_type || '').toLowerCase().includes('probate') || (p.deal_type || '').toLowerCase().includes('estate')).length;
            const avgPrice = countyProps.length > 0 ? Math.round(countyProps.reduce((acc, p) => acc + (Number(p.price) || 0), 0) / countyProps.length) : 0;

            inspector.innerHTML = `
                <div class="bg-gray-950 p-4 rounded-xl border border-blue-500/30 space-y-3">
                    <div class="flex justify-between items-start border-b border-gray-800 pb-2">
                        <div>
                            <span class="text-[10px] text-blue-400 font-black uppercase">מחוז נבחר</span>
                            <h3 class="text-lg font-black text-white">${countyName} County</h3>
                        </div>
                        <span class="px-2 py-1 bg-blue-500/20 text-blue-300 rounded-lg text-xs font-mono font-bold">${countyProps.length} נכסים</span>
                    </div>

                    <div class="grid grid-cols-2 gap-2 text-xs">
                        <div class="bg-gray-900 p-2.5 rounded-lg border border-gray-800">
                            <span class="text-gray-400 block">מחיר ממוצע</span>
                            <strong class="text-emerald-400 font-mono text-sm">$${avgPrice.toLocaleString()}</strong>
                        </div>
                        <div class="bg-gray-900 p-2.5 rounded-lg border border-gray-800">
                            <span class="text-gray-400 block">כינוס (Foreclosure)</span>
                            <strong class="text-amber-400 font-mono text-sm">${foreclosures}</strong>
                        </div>
                        <div class="bg-gray-900 p-2.5 rounded-lg border border-gray-800">
                            <span class="text-gray-400 block">פיגורי מס (Tax)</span>
                            <strong class="text-purple-400 font-mono text-sm">${taxSales}</strong>
                        </div>
                        <div class="bg-gray-900 p-2.5 rounded-lg border border-gray-800">
                            <span class="text-gray-400 block">עיזבונות (Estate)</span>
                            <strong class="text-emerald-300 font-mono text-sm">${estates}</strong>
                        </div>
                    </div>

                    <div class="space-y-2 pt-2 border-t border-gray-800">
                        <span class="text-xs font-bold text-gray-300 block">רשימת נכסים במחוז:</span>
                        <div class="space-y-1.5 max-h-60 overflow-y-auto custom-scrollbar pr-1">
                            ${countyProps.length === 0 ? '<div class="text-xs text-gray-500 text-center py-4">אין נכסים תואמים לפילטרים במחוז זה.</div>' : 
                                countyProps.map(p => `
                                    <div class="bg-gray-900 p-2.5 rounded-lg border border-gray-800 text-xs flex justify-between items-center">
                                        <div>
                                            <strong class="text-white block">${p.address}</strong>
                                            <span class="text-gray-400 text-[10px]">${p.city} | $${(p.price || 0).toLocaleString()}</span>
                                        </div>
                                        <a href="index.html" class="px-2.5 py-1 bg-blue-600 hover:bg-blue-500 text-white rounded font-bold text-[10px]">הצג</a>
                                    </div>
                                `).join('')}
                        </div>
                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        window.onload = initMapDashboard;
    </script>
</body>
</html>
