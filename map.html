<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PA Counties Map</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; font-family: Arial, sans-serif; background: #fff; }
        #map { height: 100vh; width: 100vw; }

        /* עיצוב שם המחוז על המפה */
        .county-label {
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            color: #000000 !important;
            font-size: 11px;
            font-weight: bold;
            text-align: center;
            text-shadow: -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 1px 1px 0 #fff;
        }
        .county-label::before { display: none !important; }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // אתחול המפה במרכז פנסילבניה
        const map = L.map('map', { zoomControl: true }).setView([40.9, -77.5], 7);

        // מפת רקע נקייה ובהירה (ללא צורך במפתח)
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
            maxZoom: 19
        }).addTo(map);

        // ==========================================
        // אזור הגדרות הצבעים (Config) - השליטה שלך!
        // ==========================================
        const countyColors = {
            // "Allegheny": "lightblue",
            // "Philadelphia": "#fed7aa"
        };

        // טעינת גבולות המחוזות של פנסילבניה
        fetch('https://raw.githubusercontent.com/codeforamerica/click_that_hood/master/public/data/pennsylvania-counties.geojson')
            .then(res => res.json())
            .then(data => {
                L.geoJSON(data, {
                    style: function (feature) {
                        let rawName = feature.properties.name || "";
                        let cleanName = rawName.replace(' County', '').trim();
                        let fillColor = countyColors[cleanName] || "#ffffff"; // לבן נקי בפנים

                        return {
                            color: "#ff4d4f",     // אדום בהיר להפרדה בין המחוזות
                            weight: 2,            // עובי קו ההפרדה
                            opacity: 1,
                            fillColor: fillColor,
                            fillOpacity: 0.9      // צבע אטום
                        };
                    },
                    onEachFeature: function (feature, layer) {
                        let rawName = feature.properties.name || "";
                        let cleanName = rawName.replace(' County', '').trim();

                        // הצגת שם המחוז בשחור בדיוק במרכז האזור
                        layer.bindTooltip(cleanName, {
                            permanent: true,
                            direction: 'center',
                            className: 'county-label'
                        });
                    }
                }).addTo(map);
            })
            .catch(err => console.error("Error loading GeoJSON:", err));
    </script>
</body>
</html>
