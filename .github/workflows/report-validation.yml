name: Expanded Report Validation
on:
  pull_request:
    paths:
      - 'report.html'
      - 'report-sections.js'
      - 'report-sections.css'
      - 'test_report_sections.cjs'
      - 'deal-analysis.js'
      - 'deal-analysis-adapter.js'
      - 'deal-analysis.css'
      - 'test_deal_analysis.cjs'
      - 'report-design.css'
      - 'rehab-report.js'
      - 'rehab-estimate.js'
      - 'rehab-estimate.css'
      - 'test_rehab_estimate.cjs'
      - 'rehab-report.css'
      - 'test_rehab_report.cjs'
      - 'test_report_redesign.cjs'
      - 'test_report_loading.cjs'
      - 'test_report_collection.cjs'
      - 'test_report_provider_budget.py'
      - 'rentcast_budget.py'
      - 'COMPS_REPORTS/rentcast_usage.json'
      - '.github/workflows/expanded-report.yml'
      - '.github/workflows/report-validation.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check report module syntax
        run: |
          node --check report-sections.js
          node --check rehab-report.js
          node --check rehab-estimate.js
          node --check deal-analysis.js
          node --check deal-analysis-adapter.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify shared provider quota offline
        run: python -m unittest test_report_provider_budget.py
      - name: Validate calculations, persistence and PDF lifecycle offline
        run: |
          node test_report_sections.cjs
          node test_deal_analysis.cjs
          node test_rehab_report.cjs
          node test_rehab_estimate.cjs
          node test_report_redesign.cjs
          node test_report_loading.cjs
          node test_report_collection.cjs

