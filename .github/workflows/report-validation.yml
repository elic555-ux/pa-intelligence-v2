name: Expanded Report Validation
on:
  pull_request:
    paths:
      - 'report.html'
      - 'report-readonly.js'
      - 'report-readonly-model.js'
      - 'report-readonly.css'
      - 'report-financials.js'
      - 'report_enrichment.py'
      - 'report_area.py'
      - 'report_public_context.py'
      - 'report_public_refresh.py'
      - 'report-scenarios.js'
      - 'report-public-context.js'
      - 'test_report_scenarios.cjs'
      - 'test_report_public_context.py'
      - 'test_report_public_refresh.py'
      - 'test_report_public_context.cjs'
      - 'test_report_area.py'
      - 'report_gallery.py'
      - 'report_property_taxes.py'
      - 'test_report_property_taxes.py'
      - 'test_report_property_taxes.cjs'
      - 'test_report_gallery.py'
      - 'test_report_gallery.cjs'
      - 'closed_sales.py'
      - 'report_financing.py'
      - 'report_gemini.py'
      - 'report_photo_inputs.cjs'
      - 'test_report_gemini.py'
      - 'test_report_photo_inputs.cjs'
      - 'test_report_photo_coverage.cjs'
      - 'test_report_readonly.cjs'
      - 'test_report_readonly_collection.cjs'
      - 'rehab_pricebook.py'
      - 'rehab_pricebook.json'
      - 'test_rehab_pricebook.py'
      - 'test_report_enrichment.py'
      - 'test_closed_sales.py'
      - 'test_report_financing.py'
      - 'expanded_report.py'
      - 'test_expanded_report_enrichment.py'
      - 'deals.html'
      - 'report-sections.js'
      - 'report-sections.css'
      - 'test_report_sections.cjs'
      - 'deal-analysis.js'
      - 'deal-analysis-adapter.js'
      - 'deal-analysis.css'
      - 'test_deal_analysis.cjs'
      - 'report-design.css'
      - 'rehab-report.js'
      - 'rehab-estimate.js'
      - 'rehab-estimate.css'
      - 'test_rehab_estimate.cjs'
      - 'rehab-report.css'
      - 'test_rehab_report.cjs'
      - 'test_report_redesign.cjs'
      - 'test_report_loading.cjs'
      - 'test_report_collection.cjs'
      - 'test_report_provider_budget.py'
      - 'rentcast_budget.py'
      - 'COMPS_REPORTS/rentcast_usage.json'
      - '.github/workflows/expanded-report.yml'
      - '.github/workflows/report-validation.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check report module syntax
        run: |
          node --check report-readonly.js
          node --check report-readonly-model.js
          node --check report-financials.js
          node --check report_photo_inputs.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing backend dependency
        run: python -m pip install requests beautifulsoup4==4.15.0
      - name: Verify sources, transfer filtering and shared provider quota offline
        run: python -m unittest test_report_provider_budget.py test_closed_sales.py test_report_financing.py test_report_enrichment.py test_report_area.py test_report_public_context.py test_report_public_refresh.py test_report_gemini.py test_rehab_pricebook.py test_report_source_audit.py test_report_provider_reservation.py test_expanded_report_enrichment.py test_report_gallery.py test_report_property_taxes.py
      - name: Check report installation without provider calls
        run: python expanded_report.py check
      - name: Validate the read-only report and financial source boundaries
        run: |
          node test_report_scenarios.cjs
          node test_report_public_context.cjs
          node test_report_readonly.cjs
          node test_report_photo_inputs.cjs
          node test_report_photo_coverage.cjs
          node test_report_readonly_collection.cjs
          node test_report_property_taxes.cjs
          node test_report_gallery.cjs


      - name: Verify live official education schema
        run: python -X utf8 report_public_context.py --live-check
      - name: Verify Census connection without revealing the key
        if: always()
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: |
          python - <<'PY'
          import os, tempfile
          from pathlib import Path
          import report_area
          assert os.environ.get('CENSUS_API_KEY'), 'CENSUS_API_KEY is not configured'
          with tempfile.TemporaryDirectory() as temp:
              r=report_area.collect({'geoid':'42003170200'},Path(temp))
          print({'census_status':r['status'],'source_period':r.get('source_period'),'usable_metrics':sum(x.get('value') is not None for x in r.get('metrics',[]))})
          assert r['status'] in {'available','partial'}, 'Live official Census request failed'
          PY
