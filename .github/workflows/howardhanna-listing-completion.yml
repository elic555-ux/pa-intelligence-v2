name: Hanna Listing Completion — Erie

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'complete = continue bounded groups with GitHub saves; pilot = one group; check = saved data only.'
        type: choice
        options: [complete, pilot, check]
        required: true
        default: complete

permissions:
  contents: write

concurrency:
  group: pa-repo-write-queue
  cancel-in-progress: false

jobs:
  pilot:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install public HTML parser
        run: python -m pip install 'beautifulsoup4==4.15.0'
      - name: Verify discovery, identity, cache, limits and existing UI
        run: |
          python -m unittest -v test_howardhanna_listing_completion test_howardhanna_listing_pilot test_howardhanna_listing_source test_eriemoves_listing_source test_erie_source_access_check test_property_sources
          node test_secondary_sources.cjs
          node test_eriemoves_browser.cjs
          node test_howardhanna_browser.cjs
      - name: Inspect or complete a bounded Hanna group
        id: worker
        env:
          ERIE_MODE: ${{ inputs.mode }}
        run: |
          if [ "$ERIE_MODE" = 'complete' ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            python -u howardhanna_listing_completion.py --checkpoint-git
          else
            python howardhanna_listing_pilot.py "$ERIE_MODE"
          fi
      - name: Refresh the separate source registry
        if: steps.worker.outputs.save == 'true'
        run: python property_sources.py build
      - name: Save Hanna pilot
        if: steps.worker.outputs.save == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- COMPS_REPORTS/howardhanna_listing_pilot COMPS_REPORTS/property_sources
          if [ -d COMPS_REPORTS/additional_sources ]; then git add -- COMPS_REPORTS/additional_sources; fi
          if git diff --cached --quiet; then exit 0; fi
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo '::error::Repository changed during the pilot. Nothing pushed; run the pilot again.'
            exit 1
          fi
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          import property_sources
          receipt = json.loads(Path('COMPS_REPORTS/howardhanna_listing_pilot/status.json').read_text())
          manifest = json.loads(Path('COMPS_REPORTS/property_sources/manifest.json').read_text())
          _, current = property_sources.prepare(Path('.'))
          if hashlib.sha256(Path('properties.json').read_bytes()).hexdigest() != receipt['properties_sha256']:
              raise SystemExit('Inventory changed during completion. Nothing pushed.')
          if any(current[k] != manifest[k] for k in ('properties_sha256', 'input_fingerprint')):
              raise SystemExit('Registry inputs changed during completion. Nothing pushed.')
          PY
          git commit -m 'Save bounded Howard Hanna discovery and three-property completion'
          git push origin HEAD:main
