name: Limited Live Source Trial
on:
  pull_request:
    paths:
      - 'tools/live_scan_trial.py'
      - '.github/workflows/live-scan-trial.yml'
permissions:
  contents: read
concurrency:
  group: live-source-trial-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  trial:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      RENTCAST_REPORT_API_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source-reader dependencies
        run: python -m pip install beautifulsoup4 requests pytz
      - name: Run limited read-only live trial
        run: |
          python -m py_compile tools/live_scan_trial.py
          python tools/live_scan_trial.py
      - name: Verify no tracked data changed
        if: always()
        run: git diff --exit-code
