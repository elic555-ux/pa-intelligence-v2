name: Run Allegheny Sheriff Scraper

on:
  workflow_dispatch:

permissions:
  contents: write

# Use the same repository-wide writer queue as the central scanner.
concurrency:
  group: pa-repo-write-queue
  cancel-in-progress: false

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Sheriff Scraper
        run: |
          python scrapers/04_allegheny_sheriff.py October-Sale-List-Updated-9-24.pdf

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add properties.json scanner_status.json
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update properties from Sheriff PDF"
            if ! git pull --rebase origin "${GITHUB_REF_NAME}"; then
              git rebase --abort || true
              echo "::error::Could not safely rebase Sheriff data. No conflicted files were pushed."
              exit 1
            fi
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
