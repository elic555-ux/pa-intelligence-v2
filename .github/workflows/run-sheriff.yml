name: Run Allegheny Sheriff Scraper

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Sheriff Scraper
        run: |
          python scrapers/04_allegheny_sheriff.py October-Sale-List-Updated-9-24.pdf

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add properties.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update properties from Sheriff PDF" && git push)
