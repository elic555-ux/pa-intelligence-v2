name: Restore archived city or county inventory

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Restore by city or county
        type: choice
        options: [city, county]
        required: true
      name:
        description: Exact city or county name
        type: string
        required: true
      mode:
        description: Preview or restore
        type: choice
        options: [check, restore]
        default: check
        required: true

permissions:
  contents: write

concurrency:
  group: pa-repo-write-queue
  cancel-in-progress: false

jobs:
  restore:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore archived inventory records
        env:
          SCOPE: ${{ inputs.scope }}
          AREA_NAME: ${{ inputs.name }}
          MODE: ${{ inputs.mode }}
        run: |
          if [ "$SCOPE" = city ]; then
            if [ "$MODE" = check ]; then python restore_city_archive.py --city "$AREA_NAME" --check
            else python restore_city_archive.py --city "$AREA_NAME"; fi
          else
            if [ "$MODE" = check ]; then python restore_city_archive.py --county "$AREA_NAME" --check
            else python restore_city_archive.py --county "$AREA_NAME"; fi
          fi
      - name: Save restored inventory
        if: inputs.mode == 'restore'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add properties.json sheriff_listings.json COMPS_REPORTS/inventory_city_archive/properties.json COMPS_REPORTS/inventory_city_archive/sheriff_listings.json
          if git diff --cached --quiet; then exit 0; fi
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo 'Repository changed during restore. Nothing pushed; run again.'
            exit 1
          fi
          git commit -m "Restore archived properties for selected area"
          git push origin HEAD:main
