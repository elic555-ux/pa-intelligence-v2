name: PA Real Estate Scheduled Intelligence Scan

on:
  schedule:
    - cron: '0 16 * * 1-6'
  workflow_dispatch:
    inputs:
      scanner_id:
        description: 'Select Scanner ID (e.g., 06_probate_estates)'
        required: true
        default: '06_probate_estates'
      target_county:
        description: 'Target County (e.g., Allegheny)'
        required: true
        default: 'Allegheny'
      target_city:
        description: 'Target City (e.g., Homestead)'
        required: true
        default: 'Homestead'

jobs:
  run-scanners:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytz requests beautifulsoup4

      - name: Execute Orchestrator
        env:
          INPUT_SCANNER: ${{ github.event.inputs.scanner_id }}
          INPUT_COUNTY: ${{ github.event.inputs.target_county }}
          INPUT_CITY: ${{ github.event.inputs.target_city }}
        run: |
          python orchestrator.py

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "PA-RealEstate-Bot"
          git config --global user.email "bot@parealestate.local"
          git add properties.json history.json || true
          git diff-index --quiet HEAD || git commit -m "Auto-update leads from UI params [skip ci]"
          git push
