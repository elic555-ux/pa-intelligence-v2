name: PA Real Estate Multi-Agent Pipeline

on:
  workflow_dispatch: # מאפשר הרצה ידנית בלחיצת כפתור
  schedule:
    - cron: '0 6,18 * * *' # הרצה אוטומטית פעמיים ביום

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Multi-Agent Orchestrator
      run: |
        python orchestrator.py

    - name: Commit and Push Updated Properties
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add properties.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update real estate leads [skip ci]" && git push)
