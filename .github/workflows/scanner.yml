name: PA Real Estate Scheduled Intelligence Scan

on:
  schedule:
    - cron: '0 8 * * *' # פועל אוטומטית כל יום ב-08:00 בבוקר
  workflow_dispatch:
    inputs:
      scanner_id:
        description: 'Scanner ID (e.g., 06_probate_estates)'
        required: true
        default: '06_probate_estates'
      target_county:
        description: 'Target County (e.g., Allegheny)'
        required: false
        default: 'Allegheny'
      target_city:
        description: 'Target City or Cities'
        required: false
        default: 'Pittsburgh'
      neighborhoods:
        description: 'Selected Neighborhoods'
        required: false
        default: 'All'

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Execute Scraper Engine
        env:
          SCANNER_ID: ${{ github.event.inputs.scanner_id }}
          TARGET_COUNTY: ${{ github.event.inputs.target_county }}
          TARGET_CITY: ${{ github.event.inputs.target_city }}
          SELECTED_NEIGHBORHOODS: ${{ github.event.inputs.neighborhoods }}
        run: |
          python orchestrator.py
