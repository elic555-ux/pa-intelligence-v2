name: PA Real Estate Scheduled Intelligence Scan

on:
  workflow_dispatch:
    inputs:
      scanner_id:
        description: 'Sector ID'
        required: false
        default: 'all'
      target_county:
        description: 'County'
        required: false
        default: 'Allegheny'
      target_city:
        description: 'City'
        required: false
        default: 'Pittsburgh'
      neighborhoods:
        description: 'Neighborhoods & Price Filter'
        required: false
        default: 'All'
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pytz

      - name: Execute Scraper Engine
        env:
          INPUT_SCANNER_ID: ${{ github.event.inputs.scanner_id }}
          INPUT_TARGET_COUNTY: ${{ github.event.inputs.target_county }}
          INPUT_TARGET_CITY: ${{ github.event.inputs.target_city }}
          INPUT_NEIGHBORHOODS: ${{ github.event.inputs.neighborhoods }}
        run: |
          python orchestrator.py

      - name: Commit and Push Updated Properties
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add properties.json
          git commit -m "Auto-update properties.json [skip ci]" || echo "אין שינויים לשמירה"
          git push
