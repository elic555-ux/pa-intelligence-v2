name: PA Real Estate Scheduled Intelligence Scan

on:
  schedule:
    # 16:00 UTC = 12:00 PM EST (PA Time) - Mon to Sat
    - cron: '0 16 * * 1-6'
    # 17:00 UTC = 13:00 PM EST (PA Time) - Mon and Thu
    - cron: '0 17 * * 1,4'
  workflow_dispatch: # מאפשר הפעלה ידנית בלחיצת כפתור

jobs:
  run-scanners:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytz requests beautifulsoup4

      - name: Execute Orchestrator
        run: |
          python orchestrator.py

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "PA-RealEstate-Bot"
          git config --global user.email "bot@parealestate.local"
          git add properties.json || true
          git diff-index --quiet HEAD || git commit -m "Auto-update real estate data [skip ci]"
          git push
