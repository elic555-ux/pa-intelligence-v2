name: 3. Weekly Sheriff & Tax Claims
on:
  schedule:
    - cron: '0 7 * * 0'
  workflow_dispatch:
concurrency:
  group: pa-scanner-queue
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.10' }
      - run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pytz
      - env:
          INPUT_SCANNER_ID: 'sheriff,tax'
          INPUT_TARGET_COUNTY: 'Batch_Mode'
          INPUT_TARGET_CITY: 'Pittsburgh, Allegheny, Philadelphia, Allentown, Reading, Erie, Scranton, Bethlehem, Lancaster'
          INPUT_NEIGHBORHOODS: 'SECTORS:sheriff,tax | MIN_PRICE:10000 | MAX_PRICE:250000'
        run: python orchestrator.py
      - run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add properties.json || true
          git commit -m "Auto-update: Weekly Sheriff [skip ci]" || echo "No changes"
          git pull origin main --no-rebase --strategy-option=ours || true
          git push origin main
