name: Test Sold Comps Engine

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-comps:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run comps engine
        run: |
          python comps_engine.py

      - name: Show generated report
        if: always()
        run: |
          echo "=== COMPS_REPORTS ==="
          if [ -d "COMPS_REPORTS" ]; then
            find COMPS_REPORTS -maxdepth 1 -type f -print
            for file in COMPS_REPORTS/*.json; do
              if [ -f "$file" ]; then
                echo "=== $file ==="
                cat "$file"
              fi
            done
          else
            echo "COMPS_REPORTS folder was not created."
          fi

      - name: Commit generated report
        if: success()
        run: |
          if [ -d "COMPS_REPORTS" ] && [ -n "$(find COMPS_REPORTS -maxdepth 1 -type f -name '*.json' -print -quit)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add COMPS_REPORTS/*.json
            if git diff --cached --quiet; then
              echo "No report changes to commit."
            else
              git commit -m "Test Allegheny County comps engine"
              git push
            fi
          else
            echo "No JSON report found to commit."
          fi
