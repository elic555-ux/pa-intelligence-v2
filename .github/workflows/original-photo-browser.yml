name: Public Photo Provider Trial
on:
  pull_request:
    paths:
      - original_photo_browser.py
      - probe_public_photo_provider.py
      - .github/workflows/original-photo-browser.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check the public MLS route without production writes
        run: python probe_public_photo_provider.py > original-photo-trial.json
      - uses: actions/upload-artifact@v4
        with:
          name: original-photo-trial
          path: |
            original-photo-trial.json
            provider-*.html
          retention-days: 3
