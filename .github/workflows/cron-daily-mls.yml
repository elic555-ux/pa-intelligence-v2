name: "1. Central Intelligence Orchestrator (Hourly)"

on:
  workflow_dispatch: # מאפשר שיגור ידני (Mission Control) מתוך האתר
  schedule:
    - cron: '0 * * * *' # קם כל שעה עגולה (UTC). הפייתון שלנו יחליט אם לסרוק או לישון.

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install pytz requests

      - name: Run Orchestrator (Brain)
        # אנחנו שולחים לפייתון אינדיקציה איך הוא הופעל (ידנית או אוטומטית)
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python orchestrator.py

      - name: Commit and Push Updates
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add properties.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update properties.json via Orchestrator" && git push)
