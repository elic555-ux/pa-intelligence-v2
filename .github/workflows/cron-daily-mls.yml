name: "1. Central Intelligence Orchestrator (Hourly)"

on:
  workflow_dispatch: # כפתור "שגר סריקה כעת" באתר
  schedule:
    - cron: '0 * * * *' # קם כל שעה עגולה! (01:00, 02:00...) הפייתון יחליט אם לסרוק או לישון

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install pytz requests

      - name: Run Orchestrator (Brain)
        # מכניסים את סוג ההפעלה כדי שהפייתון יידע אם זו סריקה יזומה
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python orchestrator.py

      - name: Commit and Push Updates
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add properties.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update properties.json via Orchestrator" && git push)
