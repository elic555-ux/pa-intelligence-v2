name: Photo Provider Verification
on:
  pull_request:
    paths:
      - listing_photo_fallback.py
      - .github/workflows/photo-provider-verification.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'beautifulsoup4==4.15.0'
      - name: Verify public MLS galleries without production writes
        run: |
          python listing_photo_fallback.py --id PA-MLS-1779745 --id PA-MLS-1779799 --max-requests 20 --save > photo-provider-verification.txt
          python - <<'PY'
          import json
          from pathlib import Path
          import secondary_listing_source as source
          for key in ('PA-MLS-1779745', 'PA-MLS-1779799'):
              record = json.loads((Path('COMPS_REPORTS/listing_photos') / (source.cache_key(key)+'.json')).read_text())
              print(key, record['status'], len(record['photos']), [(a['provider'], a['status']) for a in record['attempts']])
              assert len(record['photos']) == 3
              assert all(p['provider']=='preferredrealty' for p in record['photos'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-photo-receipts
          path: |
            photo-provider-verification.txt
            COMPS_REPORTS/listing_photos/*.json
          retention-days: 3
