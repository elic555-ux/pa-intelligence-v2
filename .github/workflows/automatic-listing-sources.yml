name: Automatic MLS Source Completion

on:
  pull_request:
    paths:
      - 'index.html'
      - 'secondary_sources.js'
      - 'listing_photo_fallback.py'
      - 'test_listing_photo_fallback.py'
      - 'test_listing_photo_queue.py'
      - 'test_photo_fallback_ui.cjs'
      - 'automatic_listing_sources.py'
      - 'completion_subjects.py'
      - 'completion_wakeup.py'
      - 'completion_heartbeat.py'
      - 'test_completion_heartbeat.py'
      - '.github/workflows/completion-heartbeat.yml'
      - 'test_completion_wakeup.py'
      - 'test_independent_completion.py'
      - 'test_independent_completion_ui.cjs'
      - 'price_watch.py'
      - 'test_price_watch.py'
      - 'test_price_watch_ui.cjs'
      - 'test_authentication.cjs'
      - 'test_saved_property_identity.cjs'
      - 'test_watchlist_concurrency.cjs'
      - 'test_property_maps.cjs'
      - 'street-view.html'
      - 'street-view.js'
      - 'test_street_view.cjs'
      - 'street-view-local-settings.js'
      - 'test_street_view_local_settings.cjs'
      - 'street-view-preview.js'
      - 'street-view-preview-config.json'
      - 'test_street_view_preview.cjs'
      - 'test_inventory_source_identity.py'
      - 'tarasa_listing_source.py'
      - 'secondary_listing_source.py'
      - 'orchestrator.py'
      - 'test_automatic_listing_sources.py'
      - 'scan_schedule.py'
      - 'scan_config.json'
      - 'test_scan_schedule.py'
      - 'test_completion_controls.cjs'
      - 'test_secondary_sources.cjs'
      - '.github/workflows/cron-daily-mls.yml'
      - '.github/workflows/automatic-listing-sources.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'check = no requests; batch = manual group; automatic = all saved timing/pause limits; photo_trial = read-only photo test.'
        type: choice
        options: [check, batch, automatic, photo_trial]
        required: true
        default: check
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: write

concurrency:
  # Share the scanner's write queue; do not overlap its inventory commit.
  group: ${{ github.event_name == 'pull_request' && format('pa-source-validation-{0}', github.event.pull_request.number) || 'pa-repo-write-queue' }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: python -m pip install 'beautifulsoup4==4.15.0' requests pytz PyYAML
      - name: Compile changed Python and validate workflow YAML
        run: |
          python -m py_compile orchestrator.py automatic_listing_sources.py completion_subjects.py test_automatic_listing_sources.py completion_heartbeat.py test_completion_heartbeat.py
          python -c "from pathlib import Path; import yaml; [(_ for _ in ()).throw(AssertionError(n)) if not ({'on', 'jobs'} <= set(yaml.load((Path('.github/workflows') / n).read_text(), Loader=yaml.BaseLoader) or {})) else None for n in ('cron-daily-mls.yml', 'automatic-listing-sources.yml', 'completion-heartbeat.yml')]"
      - name: Verify scan integration without live requests
        run: |
          python -c "import socket, unittest, requests; blocked = lambda *a, **k: (_ for _ in ()).throw(AssertionError('Live network requests are disabled in source integration tests')); socket.create_connection = blocked; requests.sessions.Session.request = blocked; suite = unittest.defaultTestLoader.discover('.', pattern='test_*.py'); res = unittest.TextTestRunner(verbosity=2).run(suite); raise SystemExit(0 if res.wasSuccessful() else 1)"
          node test_secondary_sources.cjs
          node test_completion_controls.cjs
          node test_independent_completion_ui.cjs
          node test_price_watch_ui.cjs
          node test_authentication.cjs
          node test_saved_property_identity.cjs
          node test_watchlist_concurrency.cjs
          node test_property_maps.cjs
          node test_street_view.cjs
          node test_street_view_preview.cjs
          node test_street_view_local_settings.cjs
          node test_photo_fallback_ui.cjs

  complete:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') &&
      inputs.mode != 'photo_trial'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Check saved completion schedule
        id: timing
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.mode }}" != "automatic" ]; then
            echo 'due=true' >> "$GITHUB_OUTPUT"
          else
            python3 scan_schedule.py completion
          fi
      - uses: actions/setup-python@v5
        if: steps.timing.outputs.due == 'true'
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        if: steps.timing.outputs.due == 'true'
        with:
          node-version: '22'
      - name: Install public HTML parser
        if: steps.timing.outputs.due == 'true'
        run: python -m pip install 'beautifulsoup4==4.15.0' requests pytz tzdata
      - name: Verify cache, identities, queue and request limits
        if: steps.timing.outputs.due == 'true'
        run: |
          python -m unittest -v test_property_sources test_secondary_listing_source test_tarasa_listing_source test_automatic_listing_sources test_scan_schedule test_independent_completion test_price_watch test_completion_wakeup test_listing_photo_fallback test_listing_photo_queue
          node test_secondary_sources.cjs
          node test_completion_controls.cjs
          node test_independent_completion_ui.cjs
          node test_price_watch_ui.cjs
          node test_authentication.cjs
          node test_saved_property_identity.cjs
          node test_photo_fallback_ui.cjs
      - name: Complete a bounded group or change activation
        if: steps.timing.outputs.due == 'true'
        id: worker
        env:
          AUTO_EVENT: ${{ github.event_name }}
          AUTO_MODE: ${{ inputs.mode }}
        run: |
          python -c "import os, subprocess, sys; mode = os.environ.get('AUTO_MODE', 'check') if os.environ.get('AUTO_EVENT') == 'workflow_dispatch' else 'automatic'; raise SystemExit('Unsupported mode') if mode not in {'check', 'pilot', 'group10', 'batch', 'enable', 'disable', 'automatic'} else subprocess.run([sys.executable, 'automatic_listing_sources.py', mode], check=True)"
      - name: Refresh registry from saved source evidence
        if: steps.worker.outputs.save == 'true'
        run: python property_sources.py build
      - name: Save source snapshots and queue
        if: steps.worker.outputs.save == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- COMPS_REPORTS/listing_photos COMPS_REPORTS/automatic_listing_sources COMPS_REPORTS/property_sources
          if [ -d COMPS_REPORTS/additional_sources ]; then git add COMPS_REPORTS/additional_sources; fi
          if [ -d COMPS_REPORTS/scan_review ]; then git add COMPS_REPORTS/scan_review; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Save bounded MLS source completion and resumable queue [skip ci]'
          pushed=false
          for i in 1 2 3; do
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              echo 'Repository changed incompatibly during completion. Nothing pushed; queue can resume on the next run.'
              exit 1
            fi
            python -c "import hashlib, json; from pathlib import Path; receipt = json.loads(Path('COMPS_REPORTS/automatic_listing_sources/status.json').read_text(encoding='utf-8')); cur = hashlib.sha256(Path('properties.json').read_bytes()).hexdigest(); raise SystemExit('Inventory changed. Nothing pushed.') if cur != receipt.get('properties_sha256') else None"
            if git push origin HEAD:main; then
              pushed=true
              break
            fi
            sleep 5
          done
          if [ "$pushed" != "true" ]; then
            echo '::error::Could not push completion updates after 3 attempts.'
            exit 1
          fi

  photo-trial:
    # A bounded, read-only trial of two explicitly requested listings.
    # No production state, cloud credentials or inventory writes.
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'photo_trial'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install public listing parser
        run: python -m pip install 'beautifulsoup4==4.15.0' requests pytz
      - name: Validate the photo worker offline before live requests
        run: python -m unittest -v test_listing_photo_fallback test_listing_photo_queue
      - name: Try original photos and two public backup sources without saving
        run: |
          python listing_photo_fallback.py --id PA-MLS-1774373 --id PA-MLS-1774350 --max-requests 20 > photo-trial.json
          python -c "import json, os; from pathlib import Path; report = json.loads(Path('photo-trial.json').read_text(encoding='utf-8').splitlines()[0]); lines = ['## Photo fallback: bounded read-only trial', 'RentCast calls: 0; no inventory, credentials or Supabase writes.'] + [item['property_id'] + ': ' + item['status'] + '; verified photo files: ' + str(len(item.get('photos', []))) + ''.join('\n- ' + a['provider'] + ': ' + a['status'] + '; HTTP ' + str(a.get('http_status')) for a in item.get('attempts', [])) for item in report.get('results', [])]; Path(os.environ['GITHUB_STEP_SUMMARY']).write_text('\n'.join(lines), encoding='utf-8'); print(json.dumps(report, ensure_ascii=False)); print('\n'.join(lines))"
      - uses: actions/upload-artifact@v4
        with:
          name: photo-fallback-trial
          path: photo-trial.json
          retention-days: 7
