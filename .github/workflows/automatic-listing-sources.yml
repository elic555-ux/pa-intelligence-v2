name: Automatic MLS Source Completion

on:
  pull_request:
    paths:
      - 'index.html'
      - 'secondary_sources.js'
      - 'automatic_listing_sources.py'
      - 'completion_subjects.py'
      - 'test_independent_completion.py'
      - 'test_independent_completion_ui.cjs'
      - 'price_watch.py'
      - 'test_price_watch.py'
      - 'test_price_watch_ui.cjs'
      - 'test_authentication.cjs'
      - 'tarasa_listing_source.py'
      - 'secondary_listing_source.py'
      - 'orchestrator.py'
      - 'test_automatic_listing_sources.py'
      - 'scan_schedule.py'
      - 'scan_config.json'
      - 'test_scan_schedule.py'
      - 'test_completion_controls.cjs'
      - 'test_secondary_sources.cjs'
      - '.github/workflows/cron-daily-mls.yml'
      - '.github/workflows/automatic-listing-sources.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'check = no requests; batch = 3–5 recent MLS properties using saved settings. Source: Tarasa.'
        type: choice
        options: [check, batch]
        required: true
        default: check
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: write

concurrency:
  # Share the scanner's write queue; do not overlap its inventory commit.
  group: ${{ github.event_name == 'pull_request' && format('pa-source-validation-{0}', github.event.pull_request.number) || 'pa-repo-write-queue' }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: python -m pip install 'beautifulsoup4==4.15.0' requests pytz PyYAML
      - name: Compile changed Python and validate workflow YAML
        run: |
          python -m py_compile orchestrator.py automatic_listing_sources.py completion_subjects.py test_automatic_listing_sources.py
          python - <<'PY'
          from pathlib import Path
          import yaml
          for name in ('cron-daily-mls.yml', 'automatic-listing-sources.yml'):
              workflow = yaml.load((Path('.github/workflows') / name).read_text(), Loader=yaml.BaseLoader)
              assert 'on' in workflow and 'jobs' in workflow, name
          PY
      - name: Verify scan integration without live requests
        run: |
          python - <<'PY'
          import socket, unittest, requests
          def blocked(*args, **kwargs):
              raise AssertionError('Live network requests are disabled in source integration tests')
          socket.create_connection = blocked
          requests.sessions.Session.request = blocked
          suite = unittest.defaultTestLoader.discover('.', pattern='test_*.py')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY
          node test_secondary_sources.cjs
          node test_completion_controls.cjs
          node test_independent_completion_ui.cjs
          node test_price_watch_ui.cjs
          node test_authentication.cjs
  complete:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Check saved completion schedule
        id: timing
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo 'due=true' >> "$GITHUB_OUTPUT"
          else
            python3 scan_schedule.py completion
          fi
      - uses: actions/setup-python@v6
        if: steps.timing.outputs.due == 'true'
        with:
          python-version: '3.11'
      - name: Install public HTML parser
        if: steps.timing.outputs.due == 'true'
        run: python -m pip install 'beautifulsoup4==4.15.0' requests pytz tzdata
      - name: Verify cache, identities, queue and request limits
        if: steps.timing.outputs.due == 'true'
        run: |
          python -m unittest -v test_property_sources test_secondary_listing_source test_tarasa_listing_source test_automatic_listing_sources test_scan_schedule test_independent_completion test_price_watch
          node test_secondary_sources.cjs
          node test_completion_controls.cjs
          node test_independent_completion_ui.cjs
          node test_price_watch_ui.cjs
          node test_authentication.cjs
      - name: Complete a bounded group or change activation
        if: steps.timing.outputs.due == 'true'
        id: worker
        env:
          AUTO_EVENT: ${{ github.event_name }}
          AUTO_MODE: ${{ inputs.mode }}
        run: |
          python - <<'PY'
          import os, subprocess, sys
          mode = os.environ.get('AUTO_MODE', 'check') if os.environ['AUTO_EVENT'] == 'workflow_dispatch' else 'automatic'
          if mode not in {'check', 'pilot', 'group10', 'batch', 'enable', 'disable', 'automatic'}:
              raise SystemExit('Unsupported mode')
          subprocess.run([sys.executable, 'automatic_listing_sources.py', mode], check=True)
          PY
      - name: Refresh registry from saved source evidence
        if: steps.worker.outputs.save == 'true'
        run: python property_sources.py build
      - name: Save source snapshots and queue
        if: steps.worker.outputs.save == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- COMPS_REPORTS/automatic_listing_sources COMPS_REPORTS/property_sources
          if [ -d COMPS_REPORTS/additional_sources ]; then git add COMPS_REPORTS/additional_sources; fi
          if [ -d COMPS_REPORTS/scan_review ]; then git add COMPS_REPORTS/scan_review; fi
          if git diff --cached --quiet; then exit 0; fi
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo 'Repository changed during completion. Nothing pushed; queue can resume on the next run.'
            exit 1
          fi
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          receipt = json.loads(Path('COMPS_REPORTS/automatic_listing_sources/status.json').read_text())
          if hashlib.sha256(Path('properties.json').read_bytes()).hexdigest() != receipt['properties_sha256']:
              raise SystemExit('Inventory changed. Nothing pushed.')
          PY
          git commit -m 'Save bounded MLS source completion and resumable queue'
          git push origin HEAD:main

