name: Gemini report connection check
run-name: Gemini photo check · ${{ inputs.property_id }}

on:
  workflow_dispatch:
    inputs:
      property_id:
        description: 'Inventory property ID (default: 1822 Fox Way)'
        type: string
        required: true
        default: PA-MLS-1779799
      free_tier_confirmed:
        description: 'I verified Free Tier for the project owning GEMINI_API_KEY'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: pa-repo-write-queue
  cancel-in-progress: false

jobs:
  check:
    if: ${{ inputs.free_tier_confirmed }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_REPORT_FREE_TIER_ENABLED: 'true'
      REPORT_CHECK_PROPERTY_ID: ${{ inputs.property_id }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install HTTP dependency
        run: python -m pip install requests==2.34.2
      - name: Analyze real listing photos once with Gemini
        run: python gemini_connection_check.py --property-id "$REPORT_CHECK_PROPERTY_ID"
      - name: Preserve result and attempt counter
        if: always()
        run: |
          if [ ! -d COMPS_REPORTS/gemini_findings ] && [ ! -f COMPS_REPORTS/gemini_connection_check.json ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -d COMPS_REPORTS/gemini_findings ]; then git add COMPS_REPORTS/gemini_findings; fi
          if [ -f COMPS_REPORTS/gemini_connection_check.json ]; then git add COMPS_REPORTS/gemini_connection_check.json; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Record explicit Gemini photo connection check'
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              echo '::error::Check result was not pushed. Do not repeat the request before checking usage.'
              exit 1
            fi
            git push origin HEAD:main
          fi
      - name: Show safe check summary
        if: always()
        run: |
          if [ -f COMPS_REPORTS/gemini_connection_check.json ]; then
            echo '### Gemini connection check' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat COMPS_REPORTS/gemini_connection_check.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
