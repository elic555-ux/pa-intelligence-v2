name: Expanded Property Report
run-name: Property report ${{ fromJSON(inputs.payload).request_id }}

on:
  workflow_dispatch:
    inputs:
      payload:
        description: 'Property report request from report.html'
        required: true
        type: string

permissions:
  contents: write

# Same queue as the existing comps workflow. No schedule and no daily scan hook.
concurrency:
  group: pa-repo-write-queue
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      RENTCAST_API_KEY: ${{ secrets.RENTCAST_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing API dependency
        run: python -m pip install requests
      - name: Validate request and reserve quota
        run: python expanded_report.py prepare --event-file "$GITHUB_EVENT_PATH" --run-id "$GITHUB_RUN_ID"
      - name: Persist reservation before contacting RentCast
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add COMPS_REPORTS
          if ! git diff --cached --quiet; then
            git commit -m 'Reserve quota for requested property report'
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              echo '::error::Reservation was not persisted. RentCast will not be called.'
              exit 1
            fi
            git push origin HEAD:main
          fi
      - name: Fetch requested data or reuse saved results
        run: python expanded_report.py execute --run-id "$GITHUB_RUN_ID"
      - name: Persist result even when a source is unavailable
        if: always()
        run: |
          if [ ! -d COMPS_REPORTS ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add COMPS_REPORTS
          if ! git diff --cached --quiet; then
            git commit -m 'Save requested property report and source cache'
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              echo '::error::Report was not pushed. The earlier quota reservation remains recorded.'
              exit 1
            fi
            git push origin HEAD:main
          fi
