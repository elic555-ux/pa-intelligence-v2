name: Expanded Property Report
run-name: ${{ inputs.payload && format('Property report {0}', fromJSON(inputs.payload).request_id) || 'Report installation check' }}

on:
  workflow_dispatch:
    inputs:
      payload:
        description: 'Leave empty for installation check. The report page sends this automatically.'
        required: false
        default: ''
        type: string
      operation:
        description: 'check = read-only check; build_internal_store = import existing data and migrate quota'
        required: true
        default: check
        type: choice
        options:
          - check
          - build_internal_store

permissions:
  contents: read

# Match the existing repository write queue. There is no scheduled API refresh.
concurrency:
  group: pa-repo-write-queue
  cancel-in-progress: false

jobs:
  installation-check:
    if: ${{ !inputs.payload && inputs.operation != 'build_internal_store' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing dependency
        run: python -m pip install requests
      - name: Check report installation without calling RentCast
        run: python expanded_report.py check

  build-internal-store:
    if: ${{ !inputs.payload && inputs.operation == 'build_internal_store' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      RENTCAST_REPORT_API_ENABLED: 'false'
      FREE_COUNTY_LOOKUPS_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing dependency
        run: python -m pip install requests
      - name: Build internal index and preserve existing quota
        run: python expanded_report.py maintain
      - name: Save internal database and migrated quota
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add COMPS_REPORTS
          if ! git diff --cached --quiet; then
            git commit -m 'Build internal property database and preserve RentCast quota'
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              echo '::error::Internal data was not pushed. No RentCast calls were made.'
              exit 1
            fi
            git push origin HEAD:main
          fi

  report:
    if: ${{ inputs.payload != '' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      RENTCAST_API_KEY: ${{ secrets.RENTCAST_API_KEY }}
      # Keep new calls disabled until the shared quota ledger is migrated.
      RENTCAST_REPORT_API_ENABLED: 'false'
      FREE_COUNTY_LOOKUPS_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing API dependency
        run: python -m pip install requests
      - name: Validate request and select saved cache
        run: python expanded_report.py prepare --event-file "$GITHUB_EVENT_PATH" --run-id "$GITHUB_RUN_ID"
      - name: Persist request before execution
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add COMPS_REPORTS
          if ! git diff --cached --quiet; then
            git commit -m 'Record requested property report and quota reservation'
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              echo '::error::Request was not persisted. Report execution will not start.'
              exit 1
            fi
            git push origin HEAD:main
          fi
          echo 'REPORT_RESERVATION_PERSISTED=true' >> "$GITHUB_ENV"
      - name: Reuse saved report data
        run: python expanded_report.py execute --run-id "$GITHUB_RUN_ID"
      - name: Persist result even when a source is unavailable
        if: always()
        run: |
          if [ ! -d COMPS_REPORTS ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add COMPS_REPORTS
          if ! git diff --cached --quiet; then
            git commit -m 'Save requested property report and source cache'
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              echo '::error::Report was not pushed. Earlier reservations remain recorded.'
              exit 1
            fi
            git push origin HEAD:main
          fi
