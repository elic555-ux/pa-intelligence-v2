<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>סורק עסקאות נדל״ן - PA Real Estate Scanner</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800;900&display=swap');
        body {
            font-family: 'Assistant', sans-serif;
            background-color: #0b0f19;
            color: #f9fafb;
        }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #111827; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #374151; border-radius: 3px; }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased">

    <!-- Header -->
    <header class="bg-gray-900/90 border-b border-gray-800 sticky top-0 z-40 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3.5 flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="p-2 bg-blue-600/20 border border-blue-500/40 rounded-xl text-blue-400">
                    <i data-lucide="scan" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="text-xl font-extrabold tracking-tight text-white flex items-center gap-2">
                        סורק עסקאות והזדמנויות בפנסילבניה
                        <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-blue-500/10 text-blue-400 border border-blue-500/20">מנוע Allegheny & Probate פעיל</span>
                    </h1>
                    <p class="text-xs text-gray-300">איתור עיזבונות, מכירות מצוקה ושריף לפי טווחי מחיר מדויקים</p>
                </div>
            </div>

            <div class="flex items-center gap-2.5 flex-wrap">
                <a href="deals.html" class="flex items-center gap-1.5 px-4 py-2 bg-gradient-to-r from-amber-600 to-orange-600 hover:from-amber-500 text-white rounded-xl text-xs font-black shadow-lg shadow-amber-600/20 transition">
                    <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
                    <span>מעבר לחדר העסקאות (Deal Room)</span>
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">

        <!-- Search & Filter Controls -->
        <section class="bg-gray-900/80 border border-gray-800 p-5 rounded-2xl space-y-4 shadow-xl">
            <div class="flex flex-wrap justify-between items-center border-b border-gray-800 pb-3 gap-2">
                <h2 class="text-base font-black text-white flex items-center gap-2">
                    <i data-lucide="sliders-horizontal" class="w-5 h-5 text-amber-400"></i>
                    מסנני סריקה ואיתור
                </h2>
                <button onclick="resetFilters()" class="text-xs text-gray-400 hover:text-amber-400 transition flex items-center gap-1 font-bold">
                    <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i> איפוס מסננים
                </button>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-3.5 text-xs">
                <!-- מחוז / אזור -->
                <div>
                    <label class="block font-bold text-gray-300 mb-1">מחוז / אזור ב-PA:</label>
                    <select id="filter-county" onchange="runScanner()" class="w-full bg-gray-950 border border-gray-700 rounded-xl px-3 py-2.5 text-white font-bold focus:border-blue-400 focus:outline-none">
                        <option value="all">כל המחוזות</option>
                        <option value="Allegheny" selected>Allegheny County (Homestead / Pittsburgh)</option>
                        <option value="Luzerne">Luzerne County (Wilkes-Barre / Hazleton)</option>
                        <option value="Berks">Berks County (Reading)</option>
                        <option value="Philadelphia">Philadelphia County</option>
                        <option value="Lehigh">Lehigh County (Allentown)</option>
                    </select>
                </div>

                <!-- סוג עסקה -->
                <div>
                    <label class="block font-bold text-gray-300 mb-1">סוג הזדמנות:</label>
                    <select id="filter-deal-type" onchange="runScanner()" class="w-full bg-gray-950 border border-gray-700 rounded-xl px-3 py-2.5 text-white font-bold focus:border-blue-400 focus:outline-none">
                        <option value="all">כל הסוגים</option>
                        <option value="Probate / Estate" selected>עיזבונות (Probate / Estate Sales)</option>
                        <option value="Sheriff Sale">מכירות שריף (Sheriff Sale)</option>
                        <option value="Tax Delinquent">חובות מס (Tax Delinquent)</option>
                        <option value="FSBO Direct">מכירה ישירה מבעלים (FSBO)</option>
                    </select>
                </div>

                <!-- מחיר מינימום -->
                <div>
                    <label class="block font-bold text-gray-300 mb-1">מחיר מינימום ($):</label>
                    <input type="number" id="filter-min-price" oninput="runScanner()" placeholder="למשל: 25,000" class="w-full bg-gray-950 border border-gray-700 rounded-xl px-3 py-2.5 text-emerald-400 font-bold focus:border-blue-400 focus:outline-none">
                </div>

                <!-- מחיר מקסימום -->
                <div>
                    <label class="block font-bold text-gray-300 mb-1">מחיר מקסימום ($):</label>
                    <input type="number" id="filter-max-price" oninput="runScanner()" placeholder="למשל: 120,000" class="w-full bg-gray-950 border border-gray-700 rounded-xl px-3 py-2.5 text-emerald-400 font-bold focus:border-blue-400 focus:outline-none">
                </div>

                <!-- כפתור הפעלה -->
                <div class="flex items-end">
                    <button onclick="runScanner()" class="w-full py-2.5 bg-blue-600 hover:bg-blue-500 text-white rounded-xl font-black flex items-center justify-center gap-2 shadow-lg shadow-blue-600/30 transition">
                        <i data-lucide="search" class="w-4 h-4"></i>
                        <span>בצע סריקה</span>
                    </button>
                </div>
            </div>
        </section>

        <!-- Scanner Results Header -->
        <div class="flex justify-between items-center">
            <h3 class="text-base font-black text-white flex items-center gap-2">
                <i data-lucide="list" class="w-5 h-5 text-blue-400"></i>
                תוצאות סריקה פעילות (<span id="results-count" class="text-amber-400">0</span> נכסים שנמצאו)
            </h3>
        </div>

        <!-- Deals Grid -->
        <section id="scanner-results-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></section>

    </main>

    <!-- Script Logic -->
    <script>
        // Data Store including Homestead & Allegheny Probate Opportunities
        const PROPERTY_DATABASE = [
            {
                id: "homestead_pr_1",
                address: "412 E 14th Ave",
                city: "Homestead",
                state: "PA",
                zip: "15120",
                county: "Allegheny",
                price: 42000,
                arv: 155000,
                deal_type: "Probate / Estate",
                description: "עיזבון טרי, בית ריק מעל שנה, יורשים מעוניינים בסגירה מהירה במזומן (As-Is).",
                sqft: 1380,
                beds: 3,
                baths: 1.5,
                status: "Active Lead"
            },
            {
                id: "homestead_pr_2",
                address: "228 W 15th Ave",
                city: "Homestead",
                state: "PA",
                zip: "15120",
                county: "Allegheny",
                price: 38000,
                arv: 145000,
                deal_type: "Probate / Estate",
                description: "נכס בירושה, יורשים מחוץ למדינה (Out-of-state), דורש פינוי תכולה ושיפוץ פנים.",
                sqft: 1250,
                beds: 3,
                baths: 1,
                status: "Active Lead"
            },
            {
                id: "homestead_pr_3",
                address: "3808 Main St",
                city: "Munhall",
                state: "PA",
                zip: "15120",
                county: "Allegheny",
                price: 58000,
                arv: 175000,
                deal_type: "Probate / Estate",
                description: "גובל בהומסטד, טאבו עיזבון מאושר (Letters Testamentary), נכס סגור הדורש חידוש מערכות.",
                sqft: 1520,
                beds: 4,
                baths: 2,
                status: "Active Lead"
            },
            {
                id: "homestead_pr_4",
                address: "715 Sarah St",
                city: "West Homestead",
                state: "PA",
                zip: "15120",
                county: "Allegheny",
                price: 45000,
                arv: 160000,
                deal_type: "Probate / Estate",
                description: "יורש יחיד, דורש איטום מרתף ועדכון לוח חשמל, מוטיבציה גבוהה למכירה מהירה.",
                sqft: 1300,
                beds: 3,
                baths: 1,
                status: "Active Lead"
            },
            {
                id: "pitt_sh_1",
                address: "524 Larimer Ave",
                city: "Pittsburgh",
                state: "PA",
                zip: "15206",
                county: "Allegheny",
                price: 65000,
                arv: 190000,
                deal_type: "Sheriff Sale",
                description: "נכס במכירת שריף עקב חוב משכנתא, אזור בביקוש גבוה לפיתוח סמוך ל-East Liberty.",
                sqft: 1650,
                beds: 3,
                baths: 2,
                status: "Upcoming Auction"
            },
            {
                id: "reading_pr_1",
                address: "772 Locust St",
                city: "Reading",
                state: "PA",
                zip: "19604",
                county: "Berks",
                price: 85000,
                arv: 171000,
                deal_type: "Probate / Estate",
                description: "נכס עיזבון בטאבו סגור, כולל חצר אחורית, דורש עבודות צבע, רצפות וגג.",
                sqft: 1450,
                beds: 3,
                baths: 1.5,
                status: "Active Lead"
            },
            {
                id: "bethlehem_fsbo_1",
                address: "493 Spruce St",
                city: "Bethlehem",
                state: "PA",
                zip: "18015",
                county: "Northampton",
                price: 128000,
                arv: 245000,
                deal_type: "FSBO Direct",
                description: "מכירה ישירה מבעל בית שפרש לגמלאות, דורש קוסמטיקה בלבד.",
                sqft: 1500,
                beds: 3,
                baths: 2,
                status: "Active Lead"
            },
            {
                id: "wb_tax_1",
                address: "310 S River St",
                city: "Wilkes-Barre",
                state: "PA",
                zip: "18702",
                county: "Luzerne",
                price: 32000,
                arv: 115000,
                deal_type: "Tax Delinquent",
                description: "פיגור בתשלומי מס עירייה מעל שנתיים, בית רחב סמוך לאוניברסיטה.",
                sqft: 1400,
                beds: 3,
                baths: 1,
                status: "Active Lead"
            }
        ];

        function runScanner() {
            const selectedCounty = document.getElementById('filter-county').value;
            const selectedType = document.getElementById('filter-deal-type').value;
            const minPrice = Number(document.getElementById('filter-min-price').value) || 0;
            const rawMax = document.getElementById('filter-max-price').value;
            const maxPrice = rawMax !== "" ? Number(rawMax) : Infinity;

            const filtered = PROPERTY_DATABASE.filter(item => {
                const matchesCounty = selectedCounty === 'all' || item.county === selectedCounty;
                const matchesType = selectedType === 'all' || item.deal_type === selectedType;
                const matchesPrice = item.price >= minPrice && item.price <= maxPrice;
                return matchesCounty && matchesType && matchesPrice;
            });

            document.getElementById('results-count').textContent = filtered.length;
            renderResults(filtered);
        }

        function resetFilters() {
            document.getElementById('filter-county').value = 'all';
            document.getElementById('filter-deal-type').value = 'all';
            document.getElementById('filter-min-price').value = '';
            document.getElementById('filter-max-price').value = '';
            runScanner();
        }

        function renderResults(deals) {
            const container = document.getElementById('scanner-results-grid');
            if (!container) return;

            if (deals.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full text-center py-16 bg-gray-900/40 border border-gray-800 rounded-3xl space-y-3">
                        <i data-lucide="search-x" class="w-12 h-12 text-gray-600 mx-auto"></i>
                        <h4 class="text-base font-bold text-white">לא נמצאו עסקאות העונות לסינון המבוקש</h4>
                        <p class="text-xs text-gray-400">נסה להרחיב את טווח המחירים או לבחור מחוז נוסף.</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            container.innerHTML = deals.map(deal => {
                const badgeColor = deal.deal_type.includes('Probate') 
                    ? 'bg-purple-500/10 text-purple-400 border-purple-500/30' 
                    : deal.deal_type.includes('Sheriff') 
                    ? 'bg-rose-500/10 text-rose-400 border-rose-500/30' 
                    : 'bg-blue-500/10 text-blue-400 border-blue-500/30';

                return `
                    <div class="bg-gray-900 border border-gray-800 hover:border-blue-500/40 rounded-2xl p-5 shadow-xl flex flex-col justify-between space-y-4 transition">
                        <div class="space-y-3">
                            <div class="flex justify-between items-start gap-2">
                                <span class="px-2.5 py-0.5 rounded-md text-xs font-black border ${badgeColor}">
                                    ${deal.deal_type}
                                </span>
                                <span class="text-[11px] text-gray-400 font-mono font-bold">${deal.county} County</span>
                            </div>

                            <div>
                                <h4 class="text-lg font-black text-white">${deal.address}</h4>
                                <p class="text-xs text-gray-300 font-bold flex items-center gap-1 mt-0.5">
                                    <i data-lucide="map-pin" class="w-3.5 h-3.5 text-blue-400"></i>
                                    ${deal.city}, PA ${deal.zip}
                                </p>
                            </div>

                            <div class="grid grid-cols-2 gap-2 bg-gray-950 p-3 rounded-xl border border-gray-800 text-center">
                                <div>
                                    <span class="text-[11px] text-gray-400 block font-bold">מחיר מבוקש / רכישה:</span>
                                    <strong class="text-xl font-black text-emerald-400">$${deal.price.toLocaleString()}</strong>
                                </div>
                                <div>
                                    <span class="text-[11px] text-gray-400 block font-bold">שווי לאחר שיפוץ (ARV):</span>
                                    <strong class="text-xl font-black text-blue-400">$${deal.arv.toLocaleString()}</strong>
                                </div>
                            </div>

                            <div class="flex justify-between text-xs text-gray-300 px-1 font-semibold">
                                <span>📐 ${deal.sqft} SqFt</span>
                                <span>🛏️ ${deal.beds} חדרים</span>
                                <span>🛁 ${deal.baths} רחצה</span>
                            </div>

                            <p class="text-xs text-gray-400 bg-gray-950/60 p-2.5 rounded-lg border border-gray-800/80 leading-relaxed">
                                ${deal.description}
                            </p>
                        </div>

                        <div class="pt-2 border-t border-gray-800">
                            <button onclick='addToPipeline(${JSON.stringify(deal)})' class="w-full py-2.5 bg-gradient-to-r from-amber-600 to-orange-600 hover:from-amber-500 text-white rounded-xl text-xs font-black shadow-lg shadow-amber-600/20 flex items-center justify-center gap-2 transition">
                                <i data-lucide="folder-plus" class="w-4 h-4"></i>
                                <span>העבר לחדר עסקאות (Deal Room)</span>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');

            lucide.createIcons();
        }

        function addToPipeline(deal) {
            let pipeline = [];
            try {
                pipeline = JSON.parse(localStorage.getItem('pa_pipeline_deals')) || [];
            } catch(e) { pipeline = []; }

            const exists = pipeline.some(item => item.address === deal.address);
            if (exists) {
                alert(`הנכס "${deal.address}" כבר קיים בחדר העסקאות שלך.`);
                return;
            }

            const pipelineDeal = {
                ...deal,
                id: deal.id || 'deal_' + Date.now(),
                is_archived: false,
                created_at: new Date().toLocaleDateString('he-IL'),
                tracker: {
                    target_buyer: 'עיזבון Homestead',
                    inspector_seen: 'none',
                    condition: '',
                    offer_made: 'no',
                    offer_amount: '',
                    emd_deposited: 'no',
                    emd_amount: '',
                    inspector_sent: 'no',
                    contractor_quote_status: 'no',
                    contractor_quote_amount: '',
                    deal_status: 'under_review',
                    negotiated_price: '',
                    deal_closed: '',
                    final_closing_price: ''
                }
            };

            pipeline.unshift(pipelineDeal);
            localStorage.setItem('pa_pipeline_deals', JSON.stringify(pipeline));
            alert(`הנכס "${deal.address}" הועבר בהצלחה לחדר העסקאות!`);
        }

        window.onload = () => {
            runScanner();
        };
    </script>
</body>
</html>
