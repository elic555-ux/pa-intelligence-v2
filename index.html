<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PA Real Estate Intelligence Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap');
        body { font-family: 'Assistant', sans-serif; background-color: #0b0f19; color: #f3f4f6; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .filter-card-active { box-shadow: 0 0 0 2px #3b82f6, 0 10px 15px -3px rgba(0, 0, 0, 0.5); transform: translateY(-2px); }
        .watchlist-btn-active { background-color: #f59e0b !important; color: #0f172a !important; border-color: #fbbf24 !important; box-shadow: 0 0 20px 2px rgba(245, 158, 11, 0.5); transform: translateY(-1px); }
        .watchlist-btn-active i { color: #0f172a !important; fill: #0f172a !important; }
        .watchlist-btn-active .badge-count { background-color: #0f172a !important; color: #fbbf24 !important; }
        .hot-deal-border { box-shadow: 0 0 16px -2px rgba(217, 119, 6, 0.3); border-color: rgba(217, 119, 6, 0.5) !important; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #111827; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #374151; border-radius: 3px; }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased">

    <!-- Header -->
    <header class="bg-gray-900/90 border-b border-gray-800 sticky top-0 z-40 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="p-2 bg-blue-600/20 border border-blue-500/40 rounded-xl text-blue-400">
                    <i data-lucide="building-2" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="text-xl font-extrabold tracking-tight text-white flex items-center gap-2">
                        PA Real Estate Intelligence Hub
                        <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-blue-500/10 text-blue-400 border border-blue-500/20">Dual-Track V5.8</span>
                    </h1>
                    <p class="text-xs text-gray-400">מודיעין נדל"ן ואיתור עסקאות מניבות והשבחה בפנסילבניה</p>
                </div>
            </div>

            <div class="flex items-center gap-2.5 flex-wrap">
                <a href="deals.html" target="_blank" class="flex items-center gap-1.5 px-4 py-2 bg-gradient-to-r from-amber-600 to-amber-700 hover:from-amber-500 hover:to-amber-600 text-white rounded-xl text-xs font-black shadow-lg shadow-amber-600/20 transition">
                    <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
                    <span>📊 חדר עסקאות (Deal Room)</span>
                </a>

                <button onclick="openOnDemandScanModal()" class="flex items-center gap-1.5 px-3.5 py-2 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white rounded-xl text-xs font-black shadow-lg shadow-blue-600/20 transition">
                    <i data-lucide="play-circle" class="w-4 h-4"></i>
                    הפעל סריקה יזומה
                </button>

                <div class="flex items-center gap-2 px-2.5 py-1.5 bg-emerald-500/10 border border-emerald-500/20 rounded-lg">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                    <span class="text-xs font-bold text-emerald-400">מנוע פעיל</span>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-5 space-y-5">

        <!-- KPI Sector Strip -->
        <section class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3">
            <button onclick="setCategory('all')" id="btn-cat-all" class="filter-card filter-card-active text-right p-3.5 rounded-2xl bg-gray-900/80 border border-blue-500/40 transition hover:border-blue-400 flex flex-col justify-between">
                <div class="flex justify-between items-center mb-1"><span class="text-xs font-bold text-gray-400">הכל</span><i data-lucide="layers" class="w-4 h-4 text-blue-400"></i></div>
                <div class="text-2xl font-black text-white" id="count-all">0</div>
            </button>
            <button onclick="setCategory('mls')" id="btn-cat-mls" class="filter-card text-right p-3.5 rounded-2xl bg-gray-900/80 border border-cyan-500/30 transition hover:border-cyan-400 flex flex-col justify-between">
                <div class="flex justify-between items-center mb-1"><span class="text-xs font-bold text-cyan-300">MLS</span><i data-lucide="trending-down" class="w-4 h-4 text-cyan-400"></i></div>
                <div class="text-2xl font-black text-cyan-300" id="count-mls">0</div>
            </button>
            <button onclick="setCategory('distressed')" id="btn-cat-distressed" class="filter-card text-right p-3.5 rounded-2xl bg-gray-900/80 border border-amber-500/30 transition hover:border-amber-400 flex flex-col justify-between">
                <div class="flex justify-between items-center mb-1"><span class="text-xs font-bold text-amber-300">בנקים וכינוס</span><i data-lucide="shield-alert" class="w-4 h-4 text-amber-400"></i></div>
                <div class="text-2xl font-black text-amber-300" id="count-distressed">0</div>
            </button>
            <button onclick="setCategory('sheriff')" id="btn-cat-sheriff" class="filter-card text-right p-3.5 rounded-2xl bg-gray-900/80 border border-rose-500/30 transition hover:border-rose-400 flex flex-col justify-between">
                <div class="flex justify-between items-center mb-1"><span class="text-xs font-bold text-rose-300">מכירות שריף</span><i data-lucide="gavel" class="w-4 h-4 text-rose-400"></i></div>
                <div class="text-2xl font-black text-rose-300" id="count-sheriff">0</div>
            </button>
            <button onclick="setCategory('tax')" id="btn-cat-tax" class="filter-card text-right p-3.5 rounded-2xl bg-gray-900/80 border border-purple-500/30 transition hover:border-purple-400 flex flex-col justify-between">
                <div class="flex justify-between items-center mb-1"><span class="text-xs font-bold text-purple-300">פיגורי מס</span><i data-lucide="receipt" class="w-4 h-4 text-purple-400"></i></div>
                <div class="text-2xl font-black text-purple-300" id="count-tax">0</div>
            </button>
            <button onclick="setCategory('probate')" id="btn-cat-probate" class="filter-card text-right p-3.5 rounded-2xl bg-gray-900/80 border border-emerald-500/30 transition hover:border-emerald-400 flex flex-col justify-between">
                <div class="flex justify-between items-center mb-1"><span class="text-xs font-bold text-emerald-300">עיזבונות ו-FSBO</span><i data-lucide="home" class="w-4 h-4 text-emerald-400"></i></div>
                <div class="text-2xl font-black text-emerald-300" id="count-probate">0</div>
            </button>
        </section>

        <!-- Filters Bar including Strategy Selector -->
        <section class="bg-gray-900/60 border border-gray-800 rounded-2xl p-4 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-5 gap-4 shadow-lg">
            <div>
                <label class="block text-xs font-bold text-amber-400 mb-1.5">אסטרטגיית השקעה (Dual-Track)</label>
                <select id="filter-strategy" onchange="applyFilters()" class="w-full bg-gray-950 border border-amber-500/50 rounded-xl px-3 py-2.5 text-sm text-amber-300 font-bold focus:outline-none">
                    <option value="all">כל האסטרטגיות (משולב)</option>
                    <option value="turnkey">🔑 מניב מיידי (Turnkey Cash-Flow)</option>
                    <option value="value_add">🔨 עסקאות השבחה (Value-Add / Equity)</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-300 mb-1.5">עיר / מחוז</label>
                <select id="filter-city" onchange="applyFilters()" class="w-full bg-gray-950 border border-gray-700 rounded-xl px-3 py-2.5 text-sm text-white font-bold focus:outline-none">
                    <option value="all">כל הערים והמחוזות</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-bold text-emerald-400 mb-1.5">מחיר מינימום ($)</label>
                <input type="text" id="filter-min-price" oninput="handlePriceInput(this); applyFilters();" placeholder="החל מ-0" class="w-full bg-gray-950 border-2 border-emerald-500/40 rounded-xl px-3 py-2 text-base text-emerald-400 font-black font-mono text-center">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-300 mb-1.5">מחיר מקסימום ($)</label>
                <select id="filter-price" onchange="applyFilters()" class="w-full bg-gray-950 border border-gray-700 rounded-xl px-3 py-2.5 text-sm text-white font-bold focus:outline-none">
                    <option value="all">הכל (ללא הגבלה)</option>
                    <option value="100000">עד $100,000</option>
                    <option value="150000">עד $150,000</option>
                    <option value="250000">עד $250,000</option>
                    <option value="350000">עד $350,000</option>
                    <option value="500000">עד $500,000</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-300 mb-1.5">מיון תוצאות</label>
                <select id="sort-by" onchange="applyFilters()" class="w-full bg-gray-950 border border-gray-700 rounded-xl px-3 py-2.5 text-sm text-white font-bold focus:outline-none">
                    <option value="score_desc">🔥 ציון כדאיות עסקה (Deal Score)</option>
                    <option value="price_asc">מחיר: מהנמוך לגבוה</option>
                    <option value="price_desc">מחיר: מהגבוה לנמוך</option>
                </select>
            </div>
        </section>

        <!-- Properties Grid -->
        <section id="properties-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        </section>

    </main>

    <!-- Property Modal -->
    <div id="property-modal" class="fixed inset-0 bg-black/90 backdrop-blur-md z-50 flex items-center justify-center p-3 sm:p-5 hidden">
        <div class="bg-gray-900 border border-gray-700 rounded-2xl max-w-4xl w-full p-6 space-y-5 shadow-2xl relative max-h-[92vh] overflow-y-auto custom-scrollbar">
            <div class="flex justify-between items-start border-b border-gray-800 pb-3.5">
                <div>
                    <div class="flex items-center gap-2 mb-2" id="modal-badges"></div>
                    <h3 class="text-2xl font-black text-white tracking-wide" id="modal-address"></h3>
                    <p class="text-sm text-gray-400 mt-1" id="modal-location"></p>
                </div>
                <button onclick="closePropertyModal()" class="text-gray-400 hover:text-white p-2 rounded-xl bg-gray-800/80"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>

            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 bg-gray-950 p-4 rounded-xl border border-gray-800 text-center">
                <div><span class="text-xs text-gray-400 block mb-0.5 font-bold">מחיר מבוקש</span><strong class="text-2xl font-black text-emerald-400 font-mono" id="modal-price"></strong></div>
                <div><span class="text-xs text-gray-400 block mb-0.5 font-bold">חדרים</span><strong class="text-xl font-extrabold text-white" id="modal-beds"></strong></div>
                <div><span class="text-xs text-gray-400 block mb-0.5 font-bold">אמבט</span><strong class="text-xl font-extrabold text-white" id="modal-baths"></strong></div>
                <div><span class="text-xs text-gray-400 block mb-0.5 font-bold">שטח</span><strong class="text-xl font-extrabold text-white" id="modal-sqft"></strong></div>
            </div>

            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 bg-gray-950/70 p-3 rounded-xl border border-gray-800 text-xs">
                <div><span class="text-gray-400 block font-bold">אסטרטגיה</span><strong class="text-amber-300 font-extrabold" id="modal-strategy"></strong></div>
                <div><span class="text-gray-400 block font-bold">צפי שכירות</span><strong class="text-emerald-400 font-extrabold font-mono" id="modal-rent"></strong></div>
                <div><span class="text-gray-400 block font-bold">תשואה צפויה</span><strong class="text-emerald-400 font-extrabold font-mono" id="modal-yield"></strong></div>
                <div><span class="text-gray-400 block font-bold">הערכת שיפוץ</span><strong class="text-white font-extrabold" id="modal-rehab"></strong></div>
            </div>

            <div class="bg-gray-950/80 p-4 rounded-xl border border-gray-800 text-sm leading-relaxed text-gray-200" id="modal-summary"></div>

            <div class="pt-3.5 border-t border-gray-800 flex justify-end gap-3" id="modal-action-buttons"></div>
        </div>
    </div>

    <!-- On-Demand Scan Modal -->
    <div id="ondemand-modal" class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center p-3 sm:p-5 hidden">
        <div class="bg-gray-900 border border-gray-700 rounded-2xl max-w-5xl w-full p-5 space-y-4 shadow-2xl relative max-h-[94vh] overflow-y-auto custom-scrollbar">
            
            <div class="flex justify-between items-center border-b border-gray-800 pb-2.5">
                <div class="flex items-center gap-2">
                    <i data-lucide="play-circle" class="w-5 h-5 text-blue-400"></i>
                    <h3 class="text-base font-bold text-white">הפעלת סריקה יזומה ממוקדת</h3>
                </div>
                <button onclick="closeOnDemandScanModal()" class="text-gray-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>

            <div class="bg-blue-950/30 p-3 rounded-xl border border-blue-500/40">
                <label class="block text-xs font-bold text-blue-300 mb-1">GitHub Token:</label>
                <input type="password" id="ondemand-token-input" placeholder="ghp_..." class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-xs text-white font-mono">
            </div>

            <div class="space-y-1.5">
                <span class="text-xs font-bold text-gray-300">בחר סקטורים לסריקה (המנוע יציית במדויק לבחירתך):</span>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs">
                    <label class="flex items-center gap-2 bg-gray-950 p-2 rounded-lg border border-cyan-500/30 cursor-pointer"><input type="checkbox" checked value="mls" class="ondemand-sector-box accent-cyan-500 w-4 h-4"><span class="text-cyan-300 font-bold">1. MLS וירידות מחיר (Turnkey & Moves)</span></label>
                    <label class="flex items-center gap-2 bg-gray-950 p-2 rounded-lg border border-amber-500/30 cursor-pointer"><input type="checkbox" checked value="reo" class="ondemand-sector-box accent-amber-500 w-4 h-4"><span class="text-amber-300 font-bold">2. כינוס נכסים ובנקים (Bank REO)</span></label>
                    <label class="flex items-center gap-2 bg-gray-950 p-2 rounded-lg border border-rose-500/30 cursor-pointer"><input type="checkbox" checked value="sheriff" class="ondemand-sector-box accent-rose-500 w-4 h-4"><span class="text-rose-300 font-bold">3. מכירות שריף (Sheriff Sales)</span></label>
                    <label class="flex items-center gap-2 bg-gray-950 p-2 rounded-lg border border-purple-500/30 cursor-pointer"><input type="checkbox" checked value="tax" class="ondemand-sector-box accent-purple-500 w-4 h-4"><span class="text-purple-300 font-bold">4. פיגורי מס (County Tax Claim)</span></label>
                    <label class="flex items-center gap-2 bg-gray-950 p-2 rounded-lg border border-emerald-500/30 cursor-pointer sm:col-span-2"><input type="checkbox" checked value="06_probate_estates" class="ondemand-sector-box accent-emerald-500 w-4 h-4"><span class="text-emerald-300 font-bold">5. תיקי עיזבונות, יורשים ו-FSBO</span></label>
                </div>
            </div>

            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 bg-gray-950/70 p-3.5 rounded-2xl border border-gray-800">
                <div>
                    <label class="block font-bold text-gray-400 mb-1 text-xs">עיר / מחוז סריקה</label>
                    <select id="ondemand-city" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-2.5 py-2 text-white font-bold text-xs">
                        <option value="Pittsburgh" selected>Pittsburgh & Allegheny</option>
                        <option value="Philadelphia">Philadelphia</option>
                    </select>
                </div>
                <div>
                    <label class="block font-bold text-emerald-400 mb-1 text-xs">מחיר מינימום ($)</label>
                    <input type="text" id="ondemand-min-price" oninput="handlePriceInput(this)" placeholder="0" class="w-full bg-gray-900 border-2 border-emerald-500/50 rounded-xl px-2.5 py-1.5 text-emerald-400 font-black font-mono text-center text-sm">
                </div>
                <div>
                    <label class="block font-bold text-emerald-400 mb-1 text-xs">מחיר מקסימום ($)</label>
                    <input type="text" id="ondemand-max-price" oninput="handlePriceInput(this)" value="500,000" class="w-full bg-gray-900 border-2 border-emerald-500/50 rounded-xl px-2.5 py-1.5 text-emerald-400 font-black font-mono text-center text-sm">
                </div>
                <div class="flex items-end">
                    <button onclick="triggerOnDemandExecution()" class="w-full py-2 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 text-white rounded-xl text-xs font-black shadow-lg shadow-blue-600/30 flex items-center justify-center gap-1.5">
                        <i data-lucide="zap" class="w-4 h-4 text-amber-300"></i> שגר סריקה
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let rawProperties = [];
        let activeCategory = 'all';

        function handlePriceInput(input) {
            if (!input) return;
            let raw = input.value.replace(/\D/g, '');
            input.value = raw ? parseInt(raw, 10).toLocaleString('en-US') : '';
        }

        function getRawPrice(input) {
            if (!input) return 0;
            let raw = String(input.value || '').replace(/\D/g, '');
            return raw ? parseInt(raw, 10) : 0;
        }

        function setPriceFormatted(input, val) {
            if (!input) return;
            let raw = String(val || '').replace(/\D/g, '');
            input.value = (!raw || raw === '0') ? '' : parseInt(raw, 10).toLocaleString('en-US');
        }

        async function init() {
            lucide.createIcons();
            const token = localStorage.getItem('pa_github_token');
            if (token && document.getElementById('ondemand-token-input')) {
                document.getElementById('ondemand-token-input').value = token;
            }
            await loadProperties();
        }

        async function loadProperties() {
            try {
                const res = await fetch('properties.json?t=' + Date.now());
                rawProperties = await res.json();
                populateCityDropdown();
                updateCounts();
                renderCards();
            } catch (err) {
                console.error("Error loading:", err);
            }
        }

        function populateCityDropdown() {
            const dropdown = document.getElementById('filter-city');
            const cities = [...new Set(rawProperties.map(p => `${p.city} (${p.county})`))].sort();
            dropdown.innerHTML = '<option value="all">כל הערים והמחוזות</option>';
            cities.forEach(c => { dropdown.innerHTML += `<option value="${c}">${c}</option>`; });
        }

        function updateCounts() {
            document.getElementById('count-all').textContent = rawProperties.length;
            document.getElementById('count-mls').textContent = rawProperties.filter(p => (p.deal_type||'').toLowerCase().includes('mls')).length;
            document.getElementById('count-distressed').textContent = rawProperties.filter(p => (p.deal_type||'').toLowerCase().includes('foreclosure') || (p.deal_type||'').toLowerCase().includes('reo')).length;
            document.getElementById('count-sheriff').textContent = rawProperties.filter(p => (p.deal_type||'').toLowerCase().includes('sheriff')).length;
            document.getElementById('count-tax').textContent = rawProperties.filter(p => (p.deal_type||'').toLowerCase().includes('tax')).length;
            document.getElementById('count-probate').textContent = rawProperties.filter(p => (p.deal_type||'').toLowerCase().includes('probate') || (p.deal_type||'').toLowerCase().includes('fsbo')).length;
        }

        function setCategory(cat) {
            activeCategory = cat;
            ['all', 'mls', 'distressed', 'sheriff', 'tax', 'probate'].forEach(c => {
                const btn = document.getElementById(`btn-cat-${c}`);
                if (btn) btn.className = (c === cat) ? 'filter-card filter-card-active text-right p-3.5 rounded-2xl bg-gray-900/80 border border-blue-500/40 flex flex-col justify-between' : 'filter-card text-right p-3.5 rounded-2xl bg-gray-900/80 border border-gray-800 flex flex-col justify-between';
            });
            renderCards();
        }

        function applyFilters() { renderCards(); }

        function renderCards() {
            const container = document.getElementById('properties-container');
            const cityFilter = document.getElementById('filter-city').value;
            const strategyFilter = document.getElementById('filter-strategy').value;
            const priceFilter = document.getElementById('filter-price').value;
            const minPrice = getRawPrice(document.getElementById('filter-min-price'));
            const sortBy = document.getElementById('sort-by').value;

            let filtered = rawProperties.filter(p => {
                const dt = (p.deal_type || '').toLowerCase();
                if (activeCategory === 'mls' && !dt.includes('mls')) return false;
                if (activeCategory === 'distressed' && !dt.includes('foreclosure') && !dt.includes('reo')) return false;
                if (activeCategory === 'sheriff' && !dt.includes('sheriff')) return false;
                if (activeCategory === 'tax' && !dt.includes('tax')) return false;
                if (activeCategory === 'probate' && !dt.includes('probate') && !dt.includes('fsbo')) return false;

                if (strategyFilter !== 'all' && p.strategy !== strategyFilter) return false;
                if (cityFilter !== 'all' && !cityFilter.includes(p.city)) return false;

                const price = Number(p.price) || 0;
                if (minPrice > 0 && price < minPrice) return false;
                if (priceFilter !== 'all' && price > parseInt(priceFilter)) return false;
                return true;
            });

            if (sortBy === 'score_desc') filtered.sort((a, b) => (b.deal_score || 0) - (a.deal_score || 0));
            else if (sortBy === 'price_asc') filtered.sort((a, b) => (a.price || 0) - (b.price || 0));
            else if (sortBy === 'price_desc') filtered.sort((a, b) => (b.price || 0) - (a.price || 0));

            if (filtered.length === 0) {
                container.innerHTML = '<div class="col-span-3 text-center py-12 text-white font-extrabold text-base">לא נמצאו נכסים התואמים להגדרות הסינון.</div>';
                return;
            }

            container.innerHTML = filtered.map(p => {
                const isTurnkey = p.strategy === 'turnkey';
                return `
                <div onclick="openPropertyModal('${p.id}')" class="bg-gray-900 border border-gray-800 hover:border-blue-500/50 rounded-2xl p-5 shadow-lg transition flex flex-col justify-between cursor-pointer group">
                    <div>
                        <div class="flex justify-between items-center gap-2 mb-3">
                            <span class="px-2.5 py-1 rounded-md text-xs font-black ${isTurnkey ? 'bg-emerald-500/15 text-emerald-300 border border-emerald-500/30' : 'bg-amber-500/15 text-amber-300 border border-amber-500/30'}">
                                ${p.strategy_label || p.deal_type}
                            </span>
                            <span class="text-xs font-black text-blue-300 font-mono">Score: ${p.deal_score || 80}</span>
                        </div>
                        <h4 class="text-lg font-black text-white group-hover:text-blue-400 transition mb-1">${p.address}</h4>
                        <p class="text-xs font-bold text-gray-400 mb-3 flex items-center gap-1.5"><i data-lucide="map-pin" class="w-3.5 h-3.5 text-blue-400"></i> ${p.city}, ${p.county} County, PA ${p.zip || ''}</p>
                        <div class="text-2xl font-black text-emerald-400 font-mono mb-3">$${(p.price || 0).toLocaleString()}</div>
                        
                        <div class="grid grid-cols-3 gap-2 bg-gray-950 p-2.5 rounded-xl text-center text-xs text-gray-400 mb-3 border border-gray-800">
                            <div><span class="block">חדרים</span><strong class="text-white text-sm font-black">${p.beds || '-'}</strong></div>
                            <div><span class="block">אמבט</span><strong class="text-white text-sm font-black">${p.baths || '-'}</strong></div>
                            <div><span class="block">שטח</span><strong class="text-white text-sm font-black">${p.sqft || '-'}</strong></div>
                        </div>

                        <div class="bg-gray-950/70 p-2 rounded-lg border border-gray-800 text-xs mb-3 flex justify-between">
                            <span class="text-gray-400">צפי שכירות: <strong class="text-emerald-300 font-mono">${p.projected_rent || '$1,200'}</strong></span>
                            <span class="text-gray-400">${isTurnkey ? 'תשואה שוטפת:' : 'מרווח:'} <strong class="text-amber-300">${isTurnkey ? (p.gross_yield || '10%') : (p.margin_estimate || '25%')}</strong></span>
                        </div>
                    </div>

                    <div class="pt-3 border-t border-gray-800 flex items-center justify-between text-xs">
                        <span class="font-mono text-gray-400 text-[11px]">${p.docket_id || p.id}</span>
                        <span class="px-3 py-1.5 bg-gray-800 group-hover:bg-blue-600 group-hover:text-white text-blue-300 rounded-lg font-bold transition">פרטים מלאים</span>
                    </div>
                </div>
            `}).join('');
            lucide.createIcons();
        }

        function openPropertyModal(propId) {
            const p = rawProperties.find(i => String(i.id) === String(propId));
            if (!p) return;
            document.getElementById('modal-badges').innerHTML = `<span class="px-2.5 py-1 rounded-md text-xs font-black bg-blue-500/10 text-blue-300 border border-blue-500/30">${p.deal_type}</span>`;
            document.getElementById('modal-address').textContent = p.address;
            document.getElementById('modal-location').textContent = `${p.city}, ${p.county} County, PA ${p.zip || ''}`;
            document.getElementById('modal-price').textContent = `$${(p.price || 0).toLocaleString()}`;
            document.getElementById('modal-beds').textContent = p.beds || '-';
            document.getElementById('modal-baths').textContent = p.baths || '-';
            document.getElementById('modal-sqft').textContent = p.sqft ? `${p.sqft} sqft` : '-';
            document.getElementById('modal-strategy').textContent = p.strategy_label || '-';
            document.getElementById('modal-rent').textContent = p.projected_rent || '-';
            document.getElementById('modal-yield').textContent = p.gross_yield || '-';
            document.getElementById('modal-rehab').textContent = p.rehab_scope || '-';
            document.getElementById('modal-summary').textContent = p.summary || '';
            
            const fullAddr = encodeURIComponent(`${p.address}, ${p.city}, PA`);
            document.getElementById('modal-action-buttons').innerHTML = `
                <a href="https://www.google.com/maps/search/?api=1&query=${fullAddr}" target="_blank" class="px-4 py-2 bg-gray-800 hover:bg-gray-700 text-white rounded-xl text-xs font-bold transition">צפה במפה</a>
                <a href="${p.url}" target="_blank" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-bold transition">אתר המקור / מכרז</a>
            `;
            document.getElementById('property-modal').classList.remove('hidden');
            lucide.createIcons();
        }

        function closePropertyModal() { document.getElementById('property-modal').classList.add('hidden'); }
        function openOnDemandScanModal() { document.getElementById('ondemand-modal').classList.remove('hidden'); }
        function closeOnDemandScanModal() { document.getElementById('ondemand-modal').classList.add('hidden'); }

        async function triggerOnDemandExecution() {
            const token = document.getElementById('ondemand-token-input').value.trim();
            if (!token) { alert("נא להזין טוקן של GitHub."); return; }
            localStorage.setItem('pa_github_token', token);

            const selectedSectors = Array.from(document.querySelectorAll('.ondemand-sector-box:checked')).map(cb => cb.value);
            if (selectedSectors.length === 0) { alert("אנא בחר לפחות סקטור אחד."); return; }

            const minPrice = getRawPrice(document.getElementById('ondemand-min-price'));
            const maxPrice = getRawPrice(document.getElementById('ondemand-max-price')) || 500000;
            const targetCity = document.getElementById('ondemand-city').value;

            setPriceFormatted(document.getElementById('filter-min-price'), minPrice);

            const hoodsStr = `All | MIN_PRICE:${minPrice} | MAX_PRICE:${maxPrice} | SECTORS:${selectedSectors.join(',')}`;

            const payload = {
                ref: "main",
                inputs: {
                    scanner_id: selectedSectors[0],
                    target_county: "Allegheny",
                    target_city: targetCity,
                    neighborhoods: hoodsStr
                }
            };

            try {
                const response = await fetch(`https://api.github.com/repos/elic555-ux/pa-intelligence-v2/actions/workflows/scanner.yml/dispatches`, {
                    method: "POST",
                    headers: {
                        "Authorization": `token ${token}`,
                        "Accept": "application/vnd.github.v3+json",
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(payload)
                });

                if (response.ok || response.status === 204) {
                    alert(`פקודת סריקה יצאה לדרך!\nסקטורים: ${selectedSectors.join(', ')}\nטווח: $${minPrice.toLocaleString()} - $${maxPrice.toLocaleString()}`);
                    closeOnDemandScanModal();
                } else {
                    alert("שגיאה בשיגור מול GitHub. ודא שהטוקן תקין.");
                }
            } catch (e) {
                alert("שגיאת תקשורת.");
            }
        }

        window.onload = init;
    </script>
</body>
</html>
